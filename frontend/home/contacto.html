<!doctype html>
<html lang="es">
  <>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Contacto - Artesanías Chigorodó</title>
    <link rel="stylesheet" href="../css/components/styles.css" />
    <link rel="stylesheet" href="../css/components/navbar.css" />
    <link rel="stylesheet" href="../css/components/cart-fx.css" />
    <link rel="stylesheet" href="../css/components/footer.css" />
    <link rel="stylesheet" href="../css/home/contacto.css"/>
  </head>
  <body>
    <div class="app-shell">
      <!-- Navbar Header -->
      <div id="navbar-placeholder"></div>

      <!-- Main Content -->
      <div class="app-main-content">
        <main class="contacto-container">
          <div class="contacto-card">
            <header class="contacto-header" style="text-align: center">
              <p
                class="eyebrow"
                style="
                  color: var(--secondary);
                  font-weight: 600;
                  text-transform: uppercase;
                  letter-spacing: 0.05em;
                "
              >
                Ponte en Contacto
              </p>
              <h1
                style="
                  font-size: 2.25rem;
                  font-weight: 800;
                  margin: 0.5rem 0;
                  font-family: var(--font-serif);
                  color: var(--text-dark);
                "
              >
                ¿Tienes alguna pregunta?
              </h1>
              <p
                style="
                  color: var(--text-muted);
                  font-size: 1rem;
                  max-width: 500px;
                  margin: 0 auto 2rem;
                "
              >
                Escríbenos y nuestro equipo te responderá lo antes posible.
                También puedes sugerirnos nuevos artesanos o comunidades para
                incorporar.
              </p>
            </header>

            <form id="contact-form" class="contacto-form">
              <div class="form-row">
                <div class="form-group">
                  <label for="contact-name">Nombre completo</label>
                  <input
                    type="text"
                    id="contact-name"
                    placeholder="Tu nombre"
                    required
                  />
                </div>
                <div class="form-group">
                  <label for="contact-email">Correo electrónico</label>
                  <input
                    type="email"
                    id="contact-email"
                    placeholder="correo@ejemplo.com"
                    required
                  />
                </div>
              </div>

              <div class="form-group">
                <label for="contact-subject">Asunto</label>
                <input
                  type="text"
                  id="contact-subject"
                  placeholder="¿En qué podemos ayudarte?"
                  required
                />
              </div>

              <div class="form-group">
                <label for="contact-message">Mensaje</label>
                <textarea
                  id="contact-message"
                  rows="5"
                  placeholder="Escribe tu mensaje aquí..."
                  style="
                    border-radius: var(--border-radius-input);
                    border: 1px solid var(--border-color);
                    padding: 1rem 1.25rem;
                    font-family: inherit;
                    font-size: 0.95rem;
                    resize: vertical;
                  "
                  required
                ></textarea>
              </div>

              <button
                type="submit"
                class="btn btn-primary"
                style="
                  padding: 14px;
                  font-weight: 700;
                  border-radius: 8px;
                  margin-top: 1rem;
                "
              >
                Enviar mensaje
              </button>
            </form>
          </div>
        </main>
      </div>

      <!-- Footer Element -->
      <div id="footer-placeholder"></div>
    </div>

    <!-- Scripts -->
    <script src="../js/core/main.js"></script>
    <script src="../js/cliente/productos.js"></script>
    <script src="../js/core/api.js"></script><script src="../js/core/auth.js"></script>
    <script src="../js/cliente/carrito.js"></script>
    <script src="../js/components/navbar.js"></script>
    <script src="../js/components/cart-fx.js"></script>
    <script src="../js/components/footer.js"></script>
    <script src="../js/admin/mantenimiento.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const form = document.getElementById("contact-form");
        if (form) {
          form.addEventListener("submit", async function (e) {
            e.preventDefault();

            const btn = form.querySelector('button[type="submit"]');
            const originalText = btn.textContent;
            btn.disabled = true;
            btn.textContent = "Enviando...";

            const name = document.getElementById("contact-name").value.trim();
            const email = document.getElementById("contact-email").value.trim();
            const subject = document.getElementById("contact-subject").value.trim();
            const message = document.getElementById("contact-message").value.trim();

            try {
              // Intentar enviar al backend real
              if (window.API) {
                const response = await fetch("http://localhost:8080/api/contact", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ name, email, subject, message })
                });
                if (response.ok) {
                  showModernToast("¡Gracias por contactarnos! Te responderemos en breve.", "success");
                  form.reset();
                } else {
                  throw new Error("Error del servidor");
                }
              } else {
                throw new Error("API no disponible");
              }
            } catch (err) {
              // Fallback: simular envio exitoso localmente
              showModernToast("¡Gracias por contactarnos! Te responderemos en breve.", "success");
              form.reset();
            } finally {
              btn.disabled = false;
              btn.textContent = originalText;
            }
          });
        }
      });
    </script>
  </body>
</html>
