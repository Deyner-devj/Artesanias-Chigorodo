<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Restablecer contrasena</title><link rel="stylesheet" href="../css/components/styles.css"></head><body><main class="page" style="max-width:480px;margin:5rem auto"><h1>Nueva contrasena</h1><form id="reset-form"><label>Nueva contrasena<input id="password" type="password" minlength="8" required></label><button class="btn btn-primary" type="submit">Actualizar contrasena</button></form><p id="message" role="status"></p></main><script src="../js/core/api.js"></script><script>document.getElementById('reset-form').addEventListener('submit',async(e)=>{e.preventDefault();const message=document.getElementById('message');const token=new URLSearchParams(location.search).get('token');if(!token){message.textContent='El enlace no es valido.';return;}try{const data=await API.auth.resetPassword(token,document.getElementById('password').value);message.textContent=data.message;setTimeout(()=>location.href='login.html',1500);}catch(error){message.textContent=error.message;}});</script></body></html>
