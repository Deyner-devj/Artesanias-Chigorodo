<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Blog de Cultura - Artesanías Chigorodó</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/navbar.css" />
    <link rel="stylesheet" href="../css/footer.css" />
  </head>
  <body>
    <div class="app-shell">
      <div id="navbar-placeholder"></div>

      <div class="app-main-content">
        <main
          class="page"
          style="
            max-width: 800px;
            margin: 3rem auto;
            padding: 4rem 2rem;
            background: var(--bg-card);
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            text-align: center;
          "
        >
          <div style="color: var(--secondary); margin-bottom: 1.5rem">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="64"
              height="64"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"
              ></path>
            </svg>
          </div>

          <h1
            style="
              font-family: var(--font-serif);
              color: var(--text-dark);
              margin-bottom: 1rem;
            "
          >
            Blog de Cultura
          </h1>

          <div
            style="
              color: var(--text-muted);
              line-height: 1.8;
              font-size: 1.05rem;
              max-width: 600px;
              margin: 0 auto;
            "
          >
            <p style="margin-bottom: 1.5rem">
              Estamos preparando un espacio especial donde compartiremos
              historias asombrosas, mitos, leyendas y el significado detrás de
              cada tejido y técnica de nuestros artesanos colombianos.
            </p>
            <p style="font-weight: 600; color: var(--primary)">
              ¡Próximamente estaremos publicando nuestros primeros artículos!
            </p>
            <a
              href="productos.html"
              class="btn btn-primary"
              style="margin-top: 2rem"
              >Explorar el catálogo</a
            >
          </div>
        </main>
      </div>

      <div id="footer-placeholder"></div>
    </div>

    <script src="../js/main.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/footer.js"></script>
    <script src="../js/admin/mantenimiento.js"></script>
  </body>
</html>
