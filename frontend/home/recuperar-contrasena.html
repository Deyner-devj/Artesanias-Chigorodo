<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Recuperar contrasena</title><link rel="stylesheet" href="../css/components/styles.css"></head><body><main class="page" style="max-width:480px;margin:5rem auto"><h1>Recuperar contrasena</h1><p>Te enviaremos un enlace de un solo uso si tu correo esta registrado.</p><form id="forgot-form"><label>Correo electronico<input id="email" type="email" required></label><button class="btn btn-primary" type="submit">Enviar enlace</button></form><p id="message" role="status"></p><a href="login.html">Volver al inicio de sesion</a></main><script src="../js/core/api.js"></script><script>document.getElementById('forgot-form').addEventListener('submit',async(e)=>{e.preventDefault();const message=document.getElementById('message');try{const data=await API.auth.forgotPassword(document.getElementById('email').value.trim());message.textContent=data.message;}catch(error){message.textContent=error.message;}});</script></body></html>
