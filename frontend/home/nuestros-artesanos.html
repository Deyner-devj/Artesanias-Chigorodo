<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Nuestros Artesanos - Artesanias Chigorodo</title>
    <link rel="stylesheet" href="../css/components/styles.css" />
    <link rel="stylesheet" href="../css/components/navbar.css" />
    <link rel="stylesheet" href="../css/components/cart-fx.css" />
    <link rel="stylesheet" href="../css/components/footer.css" />
    <link rel="stylesheet" href="../css/home/nuestros-artesanos.css" />
  </head>
  <body>
    <div class="app-shell">
      <!-- Navbar Header -->
      <div id="navbar-placeholder"></div>

      <!-- Main Content -->
      <div class="app-main-content">
        <main class="artesanos-container">
          <header
            class="section-header"
            style="text-align: center; max-width: 700px; margin: 0 auto"
          >
            <p
              class="eyebrow"
              style="
                color: var(--secondary);
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.05em;
              "
            >
              Creadores de Tradicion
            </p>
            <h1
              style="
                font-size: 2.5rem;
                font-weight: 800;
                margin: 0.5rem 0 1rem;
                font-family: var(--font-serif);
              "
            >
              Nuestros Maestros Artesanos
            </h1>
            <p
              style="
                color: var(--text-muted);
                font-size: 1.1rem;
                line-height: 1.6;
              "
            >
              Conoce a las personas y comunidades detras de cada obra. Su
              talento, herencia cultural y dedicacion preservan viva la memoria
              colectiva del pais.
            </p>
          </header>

          <div class="artesanos-grid" id="artesanos-grid-dynamic">
            <!-- Los artesanos se cargaran dinamicamente desde el backend -->
          </div>
        </main>
      </div>

      <!-- Footer Element -->
      <div id="footer-placeholder"></div>
    </div>

    <!-- Scripts -->
    <script src="../js/core/main.js"></script>
    <script src="../js/cliente/productos.js"></script>
    <script src="../js/core/api.js"></script>
    <script src="../js/core/auth.js"></script>
    <script src="../js/cliente/carrito.js"></script>
    <script src="../js/components/navbar.js"></script>
    <script src="../js/components/cart-fx.js"></script>
    <script src="../js/components/footer.js"></script>
    <script src="../js/admin/mantenimiento.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async function () {
        const grid = document.getElementById("artesanos-grid-dynamic");
        if (!grid) return;

        // Intentar cargar desde backend API
        let artisans = [];
        if (window.API) {
          try {
            const users = await window.API.artisans.getAll();
            if (Array.isArray(users)) {
              artisans = users.map((user) => ({
                id: user.id,
                name: user.fullName,
                specialty: "Artesano registrado",
                bio: "Conoce sus piezas y su trabajo en nuestra plataforma.",
                productCount: 0,
              }));
            }
          } catch (e) {
            console.warn(
              "No se pudieron cargar artesanos del backend:",
              e.message,
            );
          }
        }

        // Si no hay datos del backend, usar informacion estatica
        if (artisans.length === 0) {
          grid.innerHTML = '<p style="color: var(--text-muted);">No hay artesanos publicados todavia.</p>';
          return;
        }
        if (false) {
          artisans = [
            {
              name: "Maria Luz Valdes",
              specialty: "Tejidos Wayuu",
              bio: "Especialista en tejidos Wayuu y bolsos artesanales. Mas de 20 anos de experiencia传承endo la cultura indigena.",
              productCount: 34,
              rating: 4.9,
              image: "../img/artesanos/Maria.jpg",
              initials: "MV",
              color: "var(--primary)",
            },
            {
              name: "Carlos Rincon",
              specialty: "Ceramica Tradicional",
              bio: "Maestro ceramista especializado en barro negro de La Chamba. Arte heredado de generaciones y reconocido internacionalmente.",
              productCount: 21,
              rating: 5.0,
              image: "../img/artesanos/Pedro.png",
              initials: "CR",
              color: "var(--secondary)",
            },
            {
              name: "Rosa Elena Suarez",
              specialty: "Sombreria Artesanal",
              bio: "Tejedora de sombreros vueltiao Zenu con la tecnica tradicional de cana flecha. Preservando la identidad cultural colombiana.",
              productCount: 18,
              rating: 4.8,
              image: "../img/artesanos/Julia.jpg",
              initials: "RS",
              color: "#0c4a6e",
            },
          ];
        }

        // Renderizar tarjetas
        grid.innerHTML = artisans
          .map(
            (a) => `
          <article class="artesano-card">
            <div
              class="artesano-header-img"
              style="
                background-image:
                  linear-gradient(rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.2)),
                  url('${a.image || "../img/home/categoria-tejidos.png"}');
                background-size: cover;
                background-position: center;
              "
            >
              <div
                class="artesano-avatar"
                style="background-color: ${a.color || "var(--primary)"}"
              >
                ${a.initials || a.name.substring(0, 2).toUpperCase()}
              </div>
            </div>
            <div class="artesano-info">
              <div>
                <h3 class="artesano-name">${a.name}</h3>
                <p class="artesano-specialty">${a.specialty}</p>
                <p class="artesano-bio">
                  ${a.bio}
                </p>
                <div class="artesano-stats" style="display: flex; gap: 1rem; margin-top: 0.75rem; font-size: 0.85rem; color: var(--text-muted);">
                  <span><strong>${a.productCount}</strong> productos</span>
                  ${a.rating ? `<span><strong>${a.rating}</strong> calificacion</span>` : ""}
                </div>
              </div>
              <a
                href="productos.html?search=${encodeURIComponent(a.name)}"
                class="btn btn-secondary"
                style="
                  align-self: flex-start;
                  padding: 10px 20px;
                  font-size: 0.9rem;
                "
                >Ver sus productos</a
              >
            </div>
          </article>
        `,
          )
          .join("");
      });
    </script>
  </body>
</html>
