<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <!-- Light background matching catalog card -->
  <rect width="100%" height="100%" fill="#FAF6F0" rx="12"/>
  
  <!-- Subtle decorative elements in the background -->
  <circle cx="200" cy="150" r="100" fill="#F0E8DC" opacity="0.5"/>
  
  <!-- Left and Right hanging loops/ropes -->
  <path d="M 40,80 Q 80,100 120,130" fill="none" stroke="#8C6239" stroke-width="4" stroke-linecap="round"/>
  <path d="M 360,80 Q 320,100 280,130" fill="none" stroke="#8C6239" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Woven Hammock Body -->
  <!-- We use multiple overlapping curved paths for the colorful San Jacinto stripes -->
  
  <!-- Main outer shadow/underlay -->
  <path d="M 80,110 Q 200,240 320,110 Q 200,210 80,110 Z" fill="#E5DFD6" opacity="0.8"/>
  
  <!-- Red Stripe -->
  <path d="M 80,110 Q 200,240 320,110 Q 200,225 80,110 Z" fill="#ED1C24"/>
  
  <!-- Blue Stripe -->
  <path d="M 90,113 Q 200,225 310,113 Q 200,212 90,113 Z" fill="#004B8D"/>
  
  <!-- Yellow Stripe -->
  <path d="M 100,116 Q 200,212 300,116 Q 200,200 100,116 Z" fill="#FDB913"/>
  
  <!-- Green Stripe -->
  <path d="M 110,119 Q 200,200 290,119 Q 200,188 110,119 Z" fill="#0F3D2E"/>
  
  <!-- Cotton White / Natural Stripe -->
  <path d="M 120,122 Q 200,188 280,122 Q 200,178 120,122 Z" fill="#FAF6F0"/>
  
  <!-- Woven Texture Lines -->
  <path d="M 90,120 Q 200,230 310,120" fill="none" stroke="#FAF6F0" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7"/>
  <path d="M 110,130 Q 200,210 290,130" fill="none" stroke="#FAF6F0" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7"/>
  <path d="M 130,140 Q 200,190 270,140" fill="none" stroke="#0F3D2E" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.5"/>
  
  <!-- Hanging fringes (flecos de macramé) under the hammock -->
  <g fill="none" stroke="#8C6239" stroke-width="1.5" stroke-linecap="round" opacity="0.85">
    <!-- Fringes following the curve of the hammock -->
    <path d="M 100,135 v 15 M 110,145 v 18 M 120,154 v 20 M 130,162 v 22 M 140,170 v 24 M 150,176 v 25 M 160,182 v 25 M 170,186 v 25 M 180,190 v 26 M 190,192 v 26 M 200,193 v 26 M 210,192 v 26 M 220,190 v 26 M 230,186 v 25 M 240,182 v 25 M 250,176 v 25 M 260,170 v 24 M 270,162 v 22 M 280,154 v 20 M 290,145 v 18 M 300,135 v 15"/>
    
    <!-- Cross-connections representing the macramé knots -->
    <path d="M 100,142 Q 105,145 110,142" />
    <path d="M 110,150 Q 115,153 120,150" />
    <path d="M 120,158 Q 125,161 130,158" />
    <path d="M 130,166 Q 135,169 140,166" />
    <path d="M 140,173 Q 145,176 150,173" />
    <path d="M 150,179 Q 155,182 160,179" />
    <path d="M 160,184 Q 165,187 170,184" />
    <path d="M 170,188 Q 175,191 180,188" />
    <path d="M 180,191 Q 185,194 190,191" />
    <path d="M 190,193 Q 195,196 200,193" />
    <path d="M 200,193 Q 205,196 210,193" />
    <path d="M 210,191 Q 215,194 220,191" />
    <path d="M 220,188 Q 225,191 230,188" />
    <path d="M 230,184 Q 235,187 240,184" />
    <path d="M 240,179 Q 245,182 250,179" />
    <path d="M 250,173 Q 255,176 260,173" />
    <path d="M 260,166 Q 265,169 270,166" />
    <path d="M 270,158 Q 275,161 280,158" />
    <path d="M 280,150 Q 285,153 290,150" />
    <path d="M 290,142 Q 295,145 300,142" />
  </g>
  
  <!-- Left and Right hanging rings/handles of the hammock -->
  <circle cx="80" cy="110" r="6" fill="#8C6239"/>
  <circle cx="320" cy="110" r="6" fill="#8C6239"/>
</svg>
