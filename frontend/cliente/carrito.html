<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Mi Carrito - Artesanías Chigorodó</title>
    <link rel="stylesheet" href="../css/components/styles.css" />
    <link rel="stylesheet" href="../css/components/navbar.css" />
    <link rel="stylesheet" href="../css/components/footer.css" />
    <link rel="stylesheet" href="../css/cliente/carrito.css" />
    <link rel="stylesheet" href="../css/cliente/checkout-journey.css" />
  </head>
  <body>
    <div class="app-shell">
      <div id="navbar-placeholder"></div>

      <div class="app-main-content">
        <main class="page cart-page-container" id="cart-main-container"></main>
      </div>

      <div id="footer-placeholder"></div>
    </div>

    <script src="../js/core/main.js"></script>
    <script src="../js/cliente/productos.js"></script>
    <script src="../js/core/api.js"></script><script src="../js/core/auth.js"></script>
    <script src="../js/cliente/carrito.js"></script>
    <script src="../js/components/navbar.js"></script>
    <script src="../js/components/footer.js"></script>
    <script src="../js/components/animaciones.js"></script>
    <script>
      // Función para formatear moneda (fuera del DOMContentLoaded para que sea global)
      function safeFormatCOP(val) {
        return new Intl.NumberFormat("es-CO", {
          style: "currency",
          currency: "COP",
          minimumFractionDigits: 0,
        }).format(val);
      }

      document.addEventListener("DOMContentLoaded", function () {
        // 1. Limpieza de sesión
        sessionStorage.removeItem("checkout_shipping_cost");
        sessionStorage.removeItem("checkout_shipping_method");
        sessionStorage.removeItem("checkout_payment_method");

        // 2. Renderizado forzado al cargar
        renderCart();
      });

      function renderCart() {
        const container = document.getElementById("cart-main-container");

        // Lectura directa y sin rodeos del LocalStorage
        const rawData = localStorage.getItem("cart_items");
        let items = [];
        try {
          items = rawData ? JSON.parse(rawData) : [];
        } catch (e) {
          items = [];
        }

        // Estado vacío
        if (!items || items.length === 0) {
          container.innerHTML = `
        <div style="text-align: center; padding: 4rem;">
          <h1 style="font-family: var(--font-serif);">Tu carrito está vacío</h1>
          <p style="margin: 1rem 0;">Aún no has agregado artesanías a tu carrito.</p>
          <a href="../home/productos.html" class="btn btn-primary">Ir al catálogo</a>
        </div>
      `;
          // Actualizar badge a 0
          if (typeof updateCartBadge === "function") updateCartBadge();
          return;
        }

        // Si hay items, construir HTML
        const total = items.reduce(
          (sum, item) => sum + item.product.price * item.quantity,
          0,
        );

        let itemsHtml = "";
        items.forEach((item) => {
          itemsHtml += `
        <div class="cart-item-card">
          <div style="display: flex; gap: 1rem; align-items: center;">
            <img src="${item.product.image}" alt="${item.product.name}" class="cart-item-img" style="width: 80px; height: 80px; object-fit: cover;" />
            <div>
              <h3 style="font-size: 1rem;">${item.product.name}</h3>
              <p style="font-size: 0.8rem;">Vendedor: ${item.product.sellerName || "Artesanías Chigorodó"}</p>
            </div>
          </div>
          <div style="font-weight: 600;">${safeFormatCOP(item.product.price)}</div>
          <div class="qty-selector-group">
            <button type="button" onclick="changeItemQty('${item.product.id}', -1)">-</button>
            <input type="text" value="${item.quantity}" readonly />
            <button type="button" onclick="changeItemQty('${item.product.id}', 1)">+</button>
          </div>
          <div style="font-weight: 700;">${safeFormatCOP(item.product.price * item.quantity)}</div>
          <button type="button" class="cart-remove-btn" onclick="removeCartItem('${item.product.id}', this)" aria-label="Eliminar producto">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
          </button>
        </div>
      `;
        });

        container.innerHTML = `
      <div class="cart-grid">
        <div class="cart-items-panel">
          <h1>Mi carrito</h1>
          <div class="cart-items-list">${itemsHtml}</div>
        </div>
        <div class="cart-summary-panel">
          <h2>Resumen</h2>
          <div class="summary-row"><span>Total</span><span>${safeFormatCOP(total)}</span></div>
          <button class="btn btn-secondary" style="width:100%" onclick="goToCheckout()">Pagar ahora</button>
        </div>
      </div>
    `;

        // Asegurar que el badge del navbar se refresque
        if (typeof updateCartBadge === "function") updateCartBadge();
      }

      function changeItemQty(productId, delta) {
        let items = JSON.parse(localStorage.getItem("cart_items") || "[]");
        let item = items.find((i) => i.product.id === productId);
        if (item) {
          item.quantity += delta;
          if (item.quantity <= 0)
            items = items.filter((i) => i.product.id !== productId);
          localStorage.setItem("cart_items", JSON.stringify(items));
        }
        renderCart();
      }

      function removeCartItem(productId, btnEl) {
        const cardEl = btnEl ? btnEl.closest(".cart-item-card") : null;

        const doRemoval = () => {
          let items = JSON.parse(localStorage.getItem("cart_items") || "[]");
          items = items.filter((i) => i.product.id !== productId);
          localStorage.setItem("cart_items", JSON.stringify(items));
          window.dispatchEvent(new Event("cartChanged"));
          renderCart();
        };

        if (cardEl && typeof window.animateToTrash === "function") {
          window.animateToTrash(cardEl, doRemoval);
        } else {
          doRemoval();
        }
      }

      function goToCheckout() {
        if (
          window.CheckoutJourney &&
          typeof window.CheckoutJourney.startFromCart === "function"
        ) {
          window.CheckoutJourney.startFromCart("checkout-info.html");
        } else {
          window.location.href = "../cliente/checkout-info.html";
        }
      }
    </script>
    <script src="../js/cliente/checkout.js"></script>
  </body>
</html>
