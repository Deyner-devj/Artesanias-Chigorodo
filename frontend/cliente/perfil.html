<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Mi Cuenta - Artesanías Chigorodó</title>
    <link
      class="page-css"
      rel="stylesheet"
      href="../css/components/styles.css"
    />
    <link
      class="page-css"
      rel="stylesheet"
      href="../css/components/navbar.css"
    />
    <link rel="stylesheet" href="../css/components/cart-fx.css" />
    <link
      class="page-css"
      rel="stylesheet"
      href="../css/components/footer.css"
    />
    <link
      class="page-css"
      rel="stylesheet"
      href="../css/components/dashboard.css"
    />
    <link
      class="page-css"
      rel="stylesheet"
      href="../css/cliente/cliente-dashboard.css"
    />
  </head>
  <body>
    <!-- Protect Route -->
    <script src="../js/core/protected-routes.js"></script>

    <div class="app-shell">
      <!-- Navbar Header -->
      <div id="navbar-placeholder"></div>

      <!-- Main Content -->
      <div class="app-main-content">
        <main class="page account-page-container">
          <div class="account-layout">
            <!-- Left Sidebar Menu -->
            <aside class="account-sidebar">
              <div
                style="
                  padding: 1.25rem;
                  border-bottom: 1px solid var(--border-color);
                  text-align: center;
                "
              >
                <h4
                  id="sidebar-user-name"
                  style="margin: 0; font-weight: 700; color: var(--text-dark)"
                >
                  Cargando...
                </h4>
                <span
                  id="sidebar-user-email"
                  style="font-size: 0.8rem; color: var(--text-muted)"
                  >Cargando...</span
                >
              </div>
              <nav class="account-sidebar-menu">
                <button
                  onclick="switchTab('pedidos')"
                  class="account-menu-item active"
                  id="tab-btn-pedidos"
                >
                  <!-- ShoppingBag Icon -->
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"
                    ></path>
                    <path d="M3 6h18"></path>
                    <path d="M16 10a4 4 0 0 1-8 0"></path>
                  </svg>
                  Mis pedidos
                </button>

                <button
                  onclick="switchTab('datos')"
                  class="account-menu-item"
                  id="tab-btn-datos"
                >
                  <!-- Settings Icon -->
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <circle cx="12" cy="12" r="3"></circle>
                    <path
                      d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
                    ></path>
                  </svg>
                  Mis datos
                </button>

                <button
                  onclick="switchTab('direcciones')"
                  class="account-menu-item"
                  id="tab-btn-direcciones"
                >
                  <!-- MapPin Icon -->
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"
                    ></path>
                    <circle cx="12" cy="10" r="3"></circle>
                  </svg>
                  Direcciones
                </button>

                <button
                  onclick="switchTab('pagos')"
                  class="account-menu-item"
                  id="tab-btn-pagos"
                >
                  <!-- CreditCard Icon -->
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <rect width="20" height="14" x="2" y="5" rx="2"></rect>
                    <line x1="2" x2="22" y1="10" y2="10"></line>
                  </svg>
                  Métodos de pago
                </button>

                <button
                  onclick="switchTab('favoritos')"
                  class="account-menu-item"
                  id="tab-btn-favoritos"
                >
                  <!-- Heart Icon -->
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"
                    ></path>
                  </svg>
                  Favoritos
                </button>

                <button
                  onclick="triggerLogout()"
                  class="account-menu-item"
                  style="
                    color: #c2410c;
                    border-top: 1px solid var(--border-color);
                    margin-top: 0.5rem;
                  "
                >
                  <!-- LogOut Icon -->
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                  </svg>
                  Cerrar sesión
                </button>
              </nav>
            </aside>

            <!-- Right Main Content -->
            <section class="account-main-content" id="account-tab-panel">
              <!-- Loaded dynamically via JS -->
            </section>
          </div>
        </main>
      </div>

      <!-- Footer Element -->
      <div id="footer-placeholder"></div>
    </div>

    <!-- Scripts -->
    <script src="../js/core/main.js"></script>
    <script src="../js/cliente/productos.js"></script>
    <script src="../js/core/api.js"></script>
    <script src="../js/core/auth.js"></script>
    <script src="../js/cliente/carrito.js"></script>
    <script src="../js/cliente/favoritos.js"></script>
    <script src="../js/cliente/perfil.js"></script>
    <script src="../js/components/navbar.js"></script>
    <script src="../js/components/cart-fx.js"></script>
    <script src="../js/components/footer.js"></script>

    <script>
      let activeTab = "pedidos";
      let selectedOrder = null;
      let allOrders = [];

      // Presets for profile form
      let profileData = {
        name: "",
        email: "",
        phone: "",
        city: "",
        address: "",
      };

      // Mapear el status de la orden a texto en español y clase CSS
      const orderStatusMap = {
        'PENDING': { status: 'pending', statusText: 'Pendiente' },
        'CONFIRMED': { status: 'confirmed', statusText: 'Confirmado' },
        'PROCESSING': { status: 'processing', statusText: 'En procesamiento' },
        'SHIPPED': { status: 'transit', statusText: 'En tránsito' },
        'DELIVERED': { status: 'delivered', statusText: 'Entregado' },
        'CANCELLED': { status: 'cancelled', statusText: 'Cancelado' },
        'REFUNDED': { status: 'refunded', statusText: 'Reembolsado' },
      };

      // Formatear fecha a formato "Mes dd, yyyy" en español
      function formatDate(dateString) {
        if (!dateString) return "Fecha desconocida";
        const date = new Date(dateString);
        const months = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
        return `${months[date.getMonth()]} ${date.getDate()}, ${date.getFullYear()}`;
      }

      // Convertir respuesta del backend a formato esperado por el frontend
      function mapOrderResponse(apiOrder) {
        const statusInfo = orderStatusMap[apiOrder.orderStatus] || { status: 'pending', statusText: apiOrder.orderStatus };
        
        return {
          id: apiOrder.orderNumber || `#AC-${apiOrder.id}`,
          date: formatDate(apiOrder.createdAt),
          status: statusInfo.status,
          statusText: statusInfo.statusText,
          total: apiOrder.total,
          address: apiOrder.shippingDetails ? apiOrder.shippingDetails.address : "",
          city: apiOrder.shippingDetails ? apiOrder.shippingDetails.city : "",
          items: apiOrder.items ? apiOrder.items.map(item => ({
            name: item.productName,
            qty: item.quantity,
            price: item.unitPrice
          })) : []
        };
      }

      async function loadOrders() {
        try {
          if (!window.API) {
            console.error("API no disponible");
            allOrders = [];
            return;
          }
          const response = await window.API.orders.getAll();
          allOrders = Array.isArray(response) ? response.map(mapOrderResponse) : [];
        } catch (error) {
          console.error("Error cargando pedidos:", error);
          allOrders = [];
        }
      }

      async function loadProfile() {
        try {
          if (!window.API) {
            console.error("API no disponible");
            return;
          }
          const user = await window.API.users.getProfile();
          if (user) {
            profileData.name = user.fullName || "";
            profileData.email = user.email || "";
            profileData.phone = user.telephone || "";
            
            // Sincronizar con la barra lateral
            document.getElementById("sidebar-user-name").textContent = profileData.name;
            document.getElementById("sidebar-user-email").textContent = profileData.email;
          }
        } catch (error) {
          console.error("Error cargando perfil:", error);
        }
      }

      document.addEventListener("DOMContentLoaded", async function () {
        // Cargar perfil y pedidos en paralelo
        await Promise.all([loadProfile(), loadOrders()]);
        
        // Si no hay usuario logueado, redirigir
        const user = getLoggedInUser();
        if (!user) {
          window.location.href = "../home/login.html";
          return;
        }

        await renderTabContent();
      });

      async function switchTab(tab) {
        activeTab = tab;
        selectedOrder = null;

        // Update sidebar active classes
        const tabs = ["pedidos", "datos", "direcciones", "pagos", "favoritos"];
        tabs.forEach((t) => {
          const btn = document.getElementById(`tab-btn-${t}`);
          if (btn) {
            btn.classList.remove("active");
            if (t === tab) {
              btn.classList.add("active");
            }
          }
        });

        await renderTabContent();
      }

      async function renderTabContent() {
        const panel = document.getElementById("account-tab-panel");

        if (activeTab === "pedidos") {
          if (selectedOrder) {
            renderOrderDetail(panel);
          } else {
            renderOrdersList(panel);
          }
        } else if (activeTab === "datos") {
          renderProfileForm(panel);
        } else if (activeTab === "direcciones") {
          await renderAddresses(panel);
        } else if (activeTab === "pagos") {
          await renderPaymentMethods(panel);
        } else if (activeTab === "favoritos") {
          await renderFavorites(panel);
        }
      }

      function renderOrdersList(panel) {
        let rowsHtml = "";
        if (allOrders.length === 0) {
          rowsHtml =
            '<p style="padding: 2rem; text-align: center; color: var(--text-muted);">No has realizado ningún pedido aún.</p>';
        } else {
          allOrders.forEach((order) => {
            rowsHtml += `
            <div class="order-row-item">
              <div class="order-col-id" style="font-weight: 700;">${order.id}</div>
              <div class="order-col-date" style="color: var(--text-muted);">${order.date}</div>
              <div>
                <span class="order-badge ${order.status}">
                  ${order.statusText}
                </span>
              </div>
              <div class="order-col-total" style="font-weight: 700;">${formatCOP(order.total)}</div>
              <div class="order-col-link">
                <button 
                  onclick="viewOrderDetails('${order.id}')" 
                  class="btn btn-outline-green" 
                  style="padding: 6px 14px; font-size: 0.8rem; border-radius: 6px;"
                >
                  Ver detalle
                </button>
              </div>
            </div>
          `;
          });
        }

        panel.innerHTML = `
        <div>
          <h2 style="font-size: 1.8rem; font-weight: 800; fontFamily: var(--font-serif); margin-bottom: 1.5rem;">Mis pedidos</h2>
          <div class="orders-list-table">
            ${rowsHtml}
          </div>
        </div>
      `;
      }

      async function viewOrderDetails(orderId) {
        selectedOrder = allOrders.find((o) => o.id === orderId) || null;
        await renderTabContent();
      }

      function renderOrderDetail(panel) {
        let itemsHtml = "";
        selectedOrder.items.forEach((item) => {
          itemsHtml += `
          <div style="display: flex; justify-content: space-between; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px;">
            <div>
              <span style="font-weight: 700; color: var(--text-dark);">${item.name}</span>
              <span style="color: var(--text-muted); font-size: 0.85rem; display: block;">Cantidad: ${item.qty}</span>
            </div>
            <span style="font-weight: 600;">${formatCOP(item.price * item.qty)}</span>
          </div>
        `;
        });

        panel.innerHTML = `
        <div style="position: relative;">
          <button 
            onclick="closeOrderDetails()" 
            style="position: absolute; top: 0; right: 0; border: none; background: none; cursor: pointer; color: var(--text-muted);"
          >
            <!-- Close SVG Icon -->
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></svg>
          </button>
          <h2 style="font-size: 1.8rem; font-weight: 800; fontFamily: var(--font-serif); margin-bottom: 1.5rem;">Detalle de Pedido ${selectedOrder.id}</h2>
          
          <div style="display: grid; grid-template-columns: 1.5fr 1fr; gap: 2rem; margin-top: 1.5rem;">
            <div>
              <h4 style="font-weight: 700; margin-bottom: 0.75rem;">Artículos del pedido</h4>
              <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                ${itemsHtml}
              </div>
            </div>
            
            <div style="background-color: var(--bg-secondary); padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border-color);">
              <h4 style="font-weight: 700; margin-bottom: 0.75rem;">Resumen de envío</h4>
              <p style="margin: 0.25rem 0; font-size: 0.9rem;"><strong>Ciudad:</strong> ${selectedOrder.city}</p>
              <p style="margin: 0.25rem 0; font-size: 0.9rem;"><strong>Dirección:</strong> ${selectedOrder.address}</p>
              <p style="margin: 0.25rem 0; font-size: 0.9rem;"><strong>Fecha compra:</strong> ${selectedOrder.date}</p>
              <p style="margin: 0.25rem 0; font-size: 0.9rem;"><strong>Estado:</strong> <span class="order-badge ${selectedOrder.status}">${selectedOrder.statusText}</span></p>
              
              <div style="height: 1px; background-color: var(--border-color); margin: 1rem 0;"></div>
              <div style="display: flex; justify-content: space-between; font-weight: 800; font-size: 1.15rem;">
                <span>Total pagado:</span>
                <span style="color: var(--primary);">${formatCOP(selectedOrder.total)}</span>
              </div>
            </div>
          </div>
        </div>
      `;
      }

      function closeOrderDetails() {
        selectedOrder = null;
        renderTabContent();
      }

      function renderProfileForm(panel) {
        panel.innerHTML = `
        <form onsubmit="saveProfile(event)">
          <h2 style="font-size: 1.8rem; font-weight: 800; fontFamily: var(--font-serif); margin-bottom: 1.5rem;">Mis datos</h2>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1.25rem;">
            <div class="input-field">
              <label>Nombre completo</label>
              <input 
                type="text" 
                id="profile-name"
                value="${profileData.name}" 
                required 
              />
            </div>
            <div class="input-field">
              <label>Correo electrónico</label>
              <input 
                type="email" 
                id="profile-email"
                value="${profileData.email}" 
                required 
              />
            </div>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1.5rem;">
            <div class="input-field">
              <label>Teléfono</label>
              <input 
                type="tel" 
                id="profile-phone"
                value="${profileData.phone}" 
                required 
              />
            </div>
            <div class="input-field">
              <label>Contraseña nueva</label>
              <input type="password" id="profile-new-password" placeholder="Escribe para cambiar tu contraseña..." />
            </div>
          </div>
          <button type="submit" class="btn btn-secondary" style="padding: 12px 24px;">Guardar cambios</button>
        </form>
      `;
      }

      async function saveProfile(e) {
        e.preventDefault();
        const newName = document.getElementById("profile-name").value;
        const newEmail = document.getElementById("profile-email").value;
        const newPhone = document.getElementById("profile-phone").value;
        const newPassword = document.getElementById("profile-new-password").value;

        try {
          // Actualizar perfil a través de la API
          const updateData = { fullName: newName };
          if (newPhone) updateData.telephone = newPhone;
          if (newPassword) updateData.password = newPassword;
          
          await window.API.users.updateProfile(updateData);
          
          // Actualizar datos locales
          profileData.name = newName;
          profileData.email = newEmail;
          profileData.phone = newPhone;

          // Update sidebar
          document.getElementById("sidebar-user-name").textContent = profileData.name;
          document.getElementById("sidebar-user-email").textContent = profileData.email;

          // Sync with sessionStorage
          const user = getLoggedInUser();
          if (user) {
            user.name = profileData.name;
            user.email = profileData.email;
            user.phone = profileData.phone;
            sessionStorage.setItem("user", JSON.stringify(user));
          }

          showModernToast("Tus datos han sido guardados con éxito.", "success");
        } catch (error) {
          const errorMessage = error.message || "Error al guardar los datos.";
          showModernToast(`Error: ${errorMessage}`, "error");
        }
      }

      async function loadAddresses() {
        try {
          if (!window.API) {
            console.error("API no disponible");
            return [];
          }
          const response = await window.API.addresses.getAll();
          return Array.isArray(response) ? response : [];
        } catch (error) {
          console.error("Error cargando direcciones:", error);
          showModernToast(`Error al cargar direcciones: ${error.message || 'Error desconocido'}`, "error");
          return [];
        }
      }

      async function loadPaymentMethods() {
        try {
          if (!window.API) {
            console.error("API no disponible");
            return [];
          }
          const response = await window.API.paymentMethods.getAll();
          return Array.isArray(response) ? response : [];
        } catch (error) {
          console.error("Error cargando métodos de pago:", error);
          showModernToast(`Error al cargar métodos de pago: ${error.message || 'Error desconocido'}`, "error");
          return [];
        }
      }

      async function renderAddresses(panel) {
        const addresses = await loadAddresses();
        
        let addressesHtml = "";
        
        if (addresses.length === 0) {
          addressesHtml = `
            <div style="padding: 1.25rem; border: 1px solid var(--border-color); border-radius: 12px; display: flex; align-items: center; justify-content: center; grid-column: 1 / -1;">
              <p style="color: var(--text-muted); margin: 0;">No tienes direcciones guardadas aún.</p>
            </div>
            <div onclick="openAddressModal()" style="padding: 1.25rem; border: 1px dashed var(--border-color); border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; min-height: 130px;">
              <span style="color: var(--primary); font-weight: 600; font-size: 0.95rem;">+ Agregar nueva dirección</span>
            </div>
          `;
        } else {
          addresses.forEach((address) => {
            const isDefault = address.isDefault ? 
              `<span style="font-size: 0.8rem; font-weight: 700; color: var(--secondary); display: flex; align-items: center; gap: 0.25rem;">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                Dirección Predeterminada
              </span>` : '';
            
            addressesHtml += `
            <div style="padding: 1.25rem; border: ${address.isDefault ? '2px solid var(--secondary)' : '1px solid var(--border-color)'}; background-color: ${address.isDefault ? '#F4FAF7' : 'transparent'}; border-radius: 12px; display: flex; flex-direction: column; gap: 0.5rem;">
              ${isDefault}
              <h4 style="margin: 0; font-weight: 700;">${address.recipientName || profileData.name || 'Sin nombre'}</h4>
              <p style="margin: 0; font-size: 0.9rem; color: var(--text-dark);">${address.addressLine || address.address || 'No especificado'}</p>
              <span style="font-size: 0.85rem; color: var(--text-muted);">${address.city || 'Ciudad'}, ${address.country || 'Colombia'}</span>
            </div>
          `;
          });
          
          addressesHtml += `
            <div onclick="openAddressModal()" style="padding: 1.25rem; border: 1px dashed var(--border-color); border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; min-height: 130px;">
              <span style="color: var(--primary); font-weight: 600; font-size: 0.95rem;">+ Agregar nueva dirección</span>
            </div>
          `;
        }
        
        panel.innerHTML = `
        <div>
          <h2 style="font-size: 1.8rem; font-weight: 800; fontFamily: var(--font-serif); margin-bottom: 1.5rem;">Direcciones de envío</h2>
          <div id="addresses-container" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
            ${addressesHtml}
          </div>
        </div>
      `;
      }

      async function renderPaymentMethods(panel) {
        const paymentMethods = await loadPaymentMethods();
        
        let methodsHtml = "";
        
        if (paymentMethods.length === 0) {
          methodsHtml = `
            <div style="padding: 1.25rem; border: 1px solid var(--border-color); border-radius: 12px; display: flex; align-items: center; justify-content: center; grid-column: 1 / -1;">
              <p style="color: var(--text-muted); margin: 0;">No tienes tarjetas guardadas aún.</p>
            </div>
            <div onclick="openPaymentMethodModal()" style="padding: 1.25rem; border: 1px dashed var(--border-color); border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; min-height: 80px;">
              <span style="color: var(--primary); font-weight: 600; font-size: 0.95rem;">+ Agregar tarjeta</span>
            </div>
          `;
        } else {
          paymentMethods.forEach((method) => {
            const last4 = method.cardNumber ? method.cardNumber.slice(-4) : '0000';
            const expiry = method.expiryDate ? method.expiryDate : '00/0000';
            const cardType = method.cardType || 'Tarjeta';
            
            methodsHtml += `
            <div style="padding: 1.25rem; border: ${method.isDefault ? '2px solid var(--secondary)' : '1px solid var(--border-color)'}; border-radius: 12px; display: flex; align-items: center; gap: 1rem; background-color: #FAF9F7;">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--secondary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"></rect><line x1="2" x2="22" y1="10" y2="10"></line></svg>
              <div>
                <h4 style="margin: 0; font-weight: 700;">${cardType} terminada en ${last4}</h4>
                <span style="font-size: 0.8rem; color: var(--text-muted);">Expira: ${expiry}</span>
              </div>
            </div>
          `;
          });
          
          methodsHtml += `
            <div onclick="openPaymentMethodModal()" style="padding: 1.25rem; border: 1px dashed var(--border-color); border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; min-height: 80px;">
              <span style="color: var(--primary); font-weight: 600; font-size: 0.95rem;">+ Agregar tarjeta</span>
            </div>
          `;
        }
        
        panel.innerHTML = `
        <div>
          <h2 style="font-size: 1.8rem; font-weight: 800; fontFamily: var(--font-serif); margin-bottom: 1.5rem;">Tarjetas guardadas</h2>
          <div id="payment-methods-container" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
            ${methodsHtml}
          </div>
        </div>
      `;
      }

      async function renderFavorites(panel) {
        try {
          const response = await window.API.favorites.getAll();
          const favorites = Array.isArray(response) ? response : [];

          if (favorites.length === 0) {
            panel.innerHTML = `
            <div>
              <h2 style="font-size: 1.8rem; font-weight: 800; fontFamily: var(--font-serif); margin-bottom: 1.5rem;">Mis piezas favoritas</h2>
              <div class="empty-state">
                <p style="font-size: 1rem; color: var(--text-muted);">No tienes piezas favoritas aun.</p>
                <p style="font-size: 0.9rem; color: var(--text-muted); margin-top: 0.5rem;">Explora el catalogo y agrega tus artesanias favoritas.</p>
                <a href="../home/productos.html" class="btn btn-primary" style="margin-top: 1rem;">Ir al catalogo</a>
              </div>
            </div>
            `;
            return;
          }

          let cardsHtml = favorites
            .map(
              (fav) => `
            <div class="favorito-card">
              <img src="${fav.product ? (fav.product.imageUrl || '../img/mochila_wayuu.png') : '../img/mochila_wayuu.png'}" alt="${fav.product ? fav.product.name : 'Producto'}" onerror="this.onerror=null;this.src='../img/mochila_wayuu.png'" />
              <div class="favorito-info">
                <h4>${fav.product ? fav.product.name : 'Producto'}</h4>
                <span class="price">${formatCOP(fav.product ? fav.product.price : 0)}</span>
                <a href="../home/producto.html?id=${fav.product ? fav.product.id : ''}">Ver pieza en catalogo</a>
                <button onclick="removeFavoriteFromUI(${fav.product ? fav.product.id : 0})" style="background:none;border:none;color:#ef4444;font-size:0.8rem;cursor:pointer;text-align:left;padding:0;margin-top:0.25rem;font-weight:600;">Eliminar de favoritos</button>
              </div>
            </div>
          `,
            )
            .join("");

          panel.innerHTML = `
          <div>
            <h2 style="font-size: 1.8rem; font-weight: 800; fontFamily: var(--font-serif); margin-bottom: 1.5rem;">Mis piezas favoritas <span style="font-size:0.9rem;font-weight:400;color:var(--text-muted);">(${favorites.length})</span></h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
              ${cardsHtml}
            </div>
          </div>
          `;
        } catch (error) {
          console.error("Error cargando favoritos:", error);
          panel.innerHTML = `
          <div>
            <h2 style="font-size: 1.8rem; font-weight: 800; fontFamily: var(--font-serif); margin-bottom: 1.5rem;">Mis piezas favoritas</h2>
            <p style="color: var(--text-muted);">Error al cargar favoritos.</p>
          </div>
          `;
        }
      }

      async function removeFavoriteFromUI(productId) {
        try {
          await window.API.favorites.remove(productId);
          showModernToast("Producto eliminado de favoritos.");
          await renderTabContent();
        } catch (error) {
          showModernToast(`Error: ${error.message || 'No se pudo eliminar'}`, "error");
        }
      }

      // Funciones para modales - AHORA FUNCIONALES
      // Delegamos a perfil.js que tiene la implementación completa
      function openAddressModal() {
        if (window.perfilHandlers && window.perfilHandlers.openAddressModal) {
          window.perfilHandlers.openAddressModal();
        } else {
          showModernToast("Error: No se pudo cargar el modal de direcciones", "error");
        }
      }

      function openPaymentMethodModal() {
        if (window.perfilHandlers && window.perfilHandlers.openPaymentMethodModal) {
          window.perfilHandlers.openPaymentMethodModal();
        } else {
          showModernToast("Error: No se pudo cargar el modal de métodos de pago", "error");
        }
      }

      function triggerLogout() {
        showModernConfirm(
          "¿Estás seguro de que deseas cerrar sesión?",
          function () {
            logoutUser();
            showModernToast("Sesión cerrada. ¡Hasta pronto!", "success");
            setTimeout(() => {
              window.location.replace("../home/index.html");
            }, 1200);
          },
        );
      }
    </script>
  </body>
</html>
