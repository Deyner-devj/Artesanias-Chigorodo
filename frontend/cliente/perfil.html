<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Mi Cuenta - Artesanías Chigorodó</title>
    <link
      class="page-css"
      rel="stylesheet"
      href="../css/components/styles.css"
    />
    <link
      class="page-css"
      rel="stylesheet"
      href="../css/components/navbar.css"
    />
    <link
      class="page-css"
      rel="stylesheet"
      href="../css/components/footer.css"
    />
    <link
      class="page-css"
      rel="stylesheet"
      href="../css/components/dashboard.css"
    />
  </head>
  <body>
    <!-- Protect Route -->
    <script src="../js/core/protected-routes.js"></script>

    <div class="app-shell">
      <!-- Navbar Header -->
      <div id="navbar-placeholder"></div>

      <!-- Main Content -->
      <div class="app-main-content">
        <main class="page account-page-container">
          <div class="account-layout">
            <!-- Left Sidebar Menu -->
            <aside class="account-sidebar">
              <div
                style="
                  padding: 1.25rem;
                  border-bottom: 1px solid var(--border-color);
                  text-align: center;
                "
              >
                <h4
                  id="sidebar-user-name"
                  style="margin: 0; font-weight: 700; color: var(--text-dark)"
                >
                  Juan Pérez
                </h4>
                <span
                  id="sidebar-user-email"
                  style="font-size: 0.8rem; color: var(--text-muted)"
                  >juanperez@mail.com</span
                >
              </div>
              <nav class="account-sidebar-menu">
                <button
                  onclick="switchTab('pedidos')"
                  class="account-menu-item active"
                  id="tab-btn-pedidos"
                >
                  <!-- ShoppingBag Icon -->
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"
                    ></path>
                    <path d="M3 6h18"></path>
                    <path d="M16 10a4 4 0 0 1-8 0"></path>
                  </svg>
                  Mis pedidos
                </button>

                <button
                  onclick="switchTab('datos')"
                  class="account-menu-item"
                  id="tab-btn-datos"
                >
                  <!-- Settings Icon -->
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <circle cx="12" cy="12" r="3"></circle>
                    <path
                      d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
                    ></path>
                  </svg>
                  Mis datos
                </button>

                <button
                  onclick="switchTab('direcciones')"
                  class="account-menu-item"
                  id="tab-btn-direcciones"
                >
                  <!-- MapPin Icon -->
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"
                    ></path>
                    <circle cx="12" cy="10" r="3"></circle>
                  </svg>
                  Direcciones
                </button>

                <button
                  onclick="switchTab('pagos')"
                  class="account-menu-item"
                  id="tab-btn-pagos"
                >
                  <!-- CreditCard Icon -->
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <rect width="20" height="14" x="2" y="5" rx="2"></rect>
                    <line x1="2" x2="22" y1="10" y2="10"></line>
                  </svg>
                  Métodos de pago
                </button>

                <button
                  onclick="switchTab('favoritos')"
                  class="account-menu-item"
                  id="tab-btn-favoritos"
                >
                  <!-- Heart Icon -->
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"
                    ></path>
                  </svg>
                  Favoritos
                </button>

                <button
                  onclick="triggerLogout()"
                  class="account-menu-item"
                  style="
                    color: #c2410c;
                    border-top: 1px solid var(--border-color);
                    margin-top: 0.5rem;
                  "
                >
                  <!-- LogOut Icon -->
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                  </svg>
                  Cerrar sesión
                </button>
              </nav>
            </aside>

            <!-- Right Main Content -->
            <section class="account-main-content" id="account-tab-panel">
              <!-- Loaded dynamically via JS -->
            </section>
          </div>
        </main>
      </div>

      <!-- Footer Element -->
      <div id="footer-placeholder"></div>
    </div>

    <!-- Scripts -->
    <script src="../js/core/main.js"></script>
    <script src="../js/cliente/productos.js"></script>
    <script src="../js/core/auth.js"></script>
    <script src="../js/cliente/carrito.js"></script>
    <script src="../js/components/navbar.js"></script>
    <script src="../js/components/footer.js"></script>

    <script>
      let activeTab = "pedidos";
      let selectedOrder = null;

      // Presets for profile form
      let profileData = {
        name: "Juan Pérez",
        email: "cliente@chigorodo.test",
        phone: "3001234567",
        city: "Medellín",
        address: "Calle 12 #45-67",
      };

      const DEFAULT_ORDERS = [
        {
          id: "#AC-2024-000125",
          date: "Mayo 28, 2024",
          status: "delivered",
          statusText: "Entregado",
          total: 505000,
          address: "Calle 12 #45-67",
          city: "Medellín",
          items: [
            { name: "Mochila Wayuu Colores del Sol", qty: 1, price: 280000 },
            { name: "Jarrón de Barro Negro", qty: 1, price: 120000 },
            { name: "Individual Tejido Multicolor (x2)", qty: 2, price: 45000 },
          ],
        },
        {
          id: "#AC-2024-000098",
          date: "Abril 14, 2024",
          status: "transit",
          statusText: "En tránsito",
          total: 320000,
          address: "Carrera 45 #89-12",
          city: "Envigado",
          items: [{ name: "Hamaca San Jacinto", qty: 1, price: 350000 }],
        },
        {
          id: "#AC-2024-000075",
          date: "Marzo 10, 2024",
          status: "delivered",
          statusText: "Entregado",
          total: 118000,
          address: "Calle 12 #45-67",
          city: "Medellín",
          items: [
            { name: "Aretes de Filigrana Momposina", qty: 1, price: 150000 },
          ],
        },
      ];

      document.addEventListener("DOMContentLoaded", function () {
        // Synchronize session details
        const user = getLoggedInUser();
        if (user) {
          profileData.name = user.name || "Juan Pérez";
          profileData.email = user.email || "cliente@chigorodo.test";
          document.getElementById("sidebar-user-name").textContent =
            profileData.name;
          document.getElementById("sidebar-user-email").textContent =
            profileData.email;
        }

        // Initialize orders database in localStorage if not exists
        if (!localStorage.getItem("orders_history")) {
          localStorage.setItem(
            "orders_history",
            JSON.stringify(DEFAULT_ORDERS),
          );
        }

        renderTabContent();
      });

      function switchTab(tab) {
        activeTab = tab;
        selectedOrder = null;

        // Update sidebar active classes
        const tabs = ["pedidos", "datos", "direcciones", "pagos", "favoritos"];
        tabs.forEach((t) => {
          const btn = document.getElementById(`tab-btn-${t}`);
          if (btn) {
            btn.classList.remove("active");
            if (t === tab) {
              btn.classList.add("active");
            }
          }
        });

        renderTabContent();
      }

      function renderTabContent() {
        const panel = document.getElementById("account-tab-panel");

        if (activeTab === "pedidos") {
          if (selectedOrder) {
            renderOrderDetail(panel);
          } else {
            renderOrdersList(panel);
          }
        } else if (activeTab === "datos") {
          renderProfileForm(panel);
        } else if (activeTab === "direcciones") {
          renderAddresses(panel);
        } else if (activeTab === "pagos") {
          renderPaymentMethods(panel);
        } else if (activeTab === "favoritos") {
          renderFavorites(panel);
        }
      }

      function renderOrdersList(panel) {
        const orders = JSON.parse(
          localStorage.getItem("orders_history") || "[]",
        );

        let rowsHtml = "";
        if (orders.length === 0) {
          rowsHtml =
            '<p style="padding: 2rem; text-align: center; color: var(--text-muted);">No has realizado ningún pedido aún.</p>';
        } else {
          orders.forEach((order) => {
            rowsHtml += `
            <div class="order-row-item">
              <div class="order-col-id" style="font-weight: 700;">${order.id}</div>
              <div class="order-col-date" style="color: var(--text-muted);">${order.date}</div>
              <div>
                <span class="order-badge ${order.status}">
                  ${order.statusText}
                </span>
              </div>
              <div class="order-col-total" style="font-weight: 700;">${formatCOP(order.total)}</div>
              <div class="order-col-link">
                <button 
                  onclick="viewOrderDetails('${order.id}')" 
                  class="btn btn-outline-green" 
                  style="padding: 6px 14px; font-size: 0.8rem; border-radius: 6px;"
                >
                  Ver detalle
                </button>
              </div>
            </div>
          `;
          });
        }

        panel.innerHTML = `
        <div>
          <h2 style="font-size: 1.8rem; font-weight: 800; fontFamily: var(--font-serif); margin-bottom: 1.5rem;">Mis pedidos</h2>
          <div class="orders-list-table">
            ${rowsHtml}
          </div>
        </div>
      `;
      }

      function viewOrderDetails(orderId) {
        const orders = JSON.parse(
          localStorage.getItem("orders_history") || "[]",
        );
        selectedOrder = orders.find((o) => o.id === orderId) || null;
        renderTabContent();
      }

      function renderOrderDetail(panel) {
        let itemsHtml = "";
        selectedOrder.items.forEach((item) => {
          itemsHtml += `
          <div style="display: flex; justify-content: space-between; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px;">
            <div>
              <span style="font-weight: 700; color: var(--text-dark);">${item.name}</span>
              <span style="color: var(--text-muted); font-size: 0.85rem; display: block;">Cantidad: ${item.qty}</span>
            </div>
            <span style="font-weight: 600;">${formatCOP(item.price * item.qty)}</span>
          </div>
        `;
        });

        panel.innerHTML = `
        <div style="position: relative;">
          <button 
            onclick="closeOrderDetails()" 
            style="position: absolute; top: 0; right: 0; border: none; background: none; cursor: pointer; color: var(--text-muted);"
          >
            <!-- Close SVG Icon -->
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></svg>
          </button>
          <h2 style="font-size: 1.8rem; font-weight: 800; fontFamily: var(--font-serif); margin-bottom: 1.5rem;">Detalle de Pedido ${selectedOrder.id}</h2>
          
          <div style="display: grid; grid-template-columns: 1.5fr 1fr; gap: 2rem; margin-top: 1.5rem;">
            <div>
              <h4 style="font-weight: 700; margin-bottom: 0.75rem;">Artículos del pedido</h4>
              <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                ${itemsHtml}
              </div>
            </div>
            
            <div style="background-color: var(--bg-secondary); padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border-color);">
              <h4 style="font-weight: 700; margin-bottom: 0.75rem;">Resumen de envío</h4>
              <p style="margin: 0.25rem 0; font-size: 0.9rem;"><strong>Ciudad:</strong> ${selectedOrder.city}</p>
              <p style="margin: 0.25rem 0; font-size: 0.9rem;"><strong>Dirección:</strong> ${selectedOrder.address}</p>
              <p style="margin: 0.25rem 0; font-size: 0.9rem;"><strong>Fecha compra:</strong> ${selectedOrder.date}</p>
              <p style="margin: 0.25rem 0; font-size: 0.9rem;"><strong>Estado:</strong> <span class="order-badge ${selectedOrder.status}">${selectedOrder.statusText}</span></p>
              
              <div style="height: 1px; background-color: var(--border-color); margin: 1rem 0;"></div>
              <div style="display: flex; justify-content: space-between; font-weight: 800; font-size: 1.15rem;">
                <span>Total pagado:</span>
                <span style="color: var(--primary);">${formatCOP(selectedOrder.total)}</span>
              </div>
            </div>
          </div>
        </div>
      `;
      }

      function closeOrderDetails() {
        selectedOrder = null;
        renderTabContent();
      }

      function renderProfileForm(panel) {
        panel.innerHTML = `
        <form onsubmit="saveProfile(event)">
          <h2 style="font-size: 1.8rem; font-weight: 800; fontFamily: var(--font-serif); margin-bottom: 1.5rem;">Mis datos</h2>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1.25rem;">
            <div class="input-field">
              <label>Nombre completo</label>
              <input 
                type="text" 
                id="profile-name"
                value="${profileData.name}" 
                required 
              />
            </div>
            <div class="input-field">
              <label>Correo electrónico</label>
              <input 
                type="email" 
                id="profile-email"
                value="${profileData.email}" 
                required 
              />
            </div>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1.5rem;">
            <div class="input-field">
              <label>Teléfono</label>
              <input 
                type="tel" 
                id="profile-phone"
                value="${profileData.phone}" 
                required 
              />
            </div>
            <div class="input-field">
              <label>Contraseña nueva</label>
              <input type="password" id="profile-new-password" placeholder="Escribe para cambiar tu contraseña..." />
            </div>
          </div>
          <button type="submit" class="btn btn-secondary" style="padding: 12px 24px;">Guardar cambios</button>
        </form>
      `;
      }

      function saveProfile(e) {
        e.preventDefault();
        profileData.name = document.getElementById("profile-name").value;
        profileData.email = document.getElementById("profile-email").value;
        profileData.phone = document.getElementById("profile-phone").value;

        // Update sidebar
        document.getElementById("sidebar-user-name").textContent =
          profileData.name;
        document.getElementById("sidebar-user-email").textContent =
          profileData.email;

        // Sync with localStorage
        const user = getLoggedInUser();
        if (user) {
          user.name = profileData.name;
          user.email = profileData.email;
          localStorage.setItem("user", JSON.stringify(user));
        }

        showModernToast("Tus datos han sido guardados con éxito.", "success");
      }

      function renderAddresses(panel) {
        panel.innerHTML = `
        <div>
          <h2 style="font-size: 1.8rem; font-weight: 800; fontFamily: var(--font-serif); margin-bottom: 1.5rem;">Direcciones de envío</h2>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
            <div style="padding: 1.25rem; border: 2px solid var(--secondary); background-color: #F4FAF7; border-radius: 12px; display: flex; flex-direction: column; gap: 0.5rem;">
              <span style="font-size: 0.8rem; font-weight: 700; color: var(--secondary); display: flex; align-items: center; gap: 0.25rem;">
                <!-- Check Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                Dirección Predeterminada
              </span>
              <h4 style="margin: 0; font-weight: 700;">${profileData.name}</h4>
              <p style="margin: 0; font-size: 0.9rem; color: var(--text-dark);">${profileData.address}</p>
              <span style="font-size: 0.85rem; color: var(--text-muted);">${profileData.city}, Colombia</span>
            </div>
            
            <div onclick="showModernToast('Funcionalidad de agregar dirección disponible próximamente.', 'success')" style="padding: 1.25rem; border: 1px dashed var(--border-color); border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; min-height: 130px;">
              <span style="color: var(--primary); font-weight: 600; font-size: 0.95rem;">+ Agregar nueva dirección</span>
            </div>
          </div>
        </div>
      `;
      }

      function renderPaymentMethods(panel) {
        panel.innerHTML = `
        <div>
          <h2 style="font-size: 1.8rem; font-weight: 800; fontFamily: var(--font-serif); margin-bottom: 1.5rem;">Tarjetas guardadas</h2>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
            <div style="padding: 1.25rem; border: 1px solid var(--border-color); border-radius: 12px; display: flex; align-items: center; gap: 1rem; background-color: #FAF9F7;">
              <!-- CreditCard Icon -->
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--secondary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"></rect><line x1="2" x2="22" y1="10" y2="10"></line></svg>
              <div>
                <h4 style="margin: 0; font-weight: 700;">Visa terminada en 4321</h4>
                <span style="font-size: 0.8rem; color: var(--text-muted);">Expira: 12 / 2028</span>
              </div>
            </div>
            
            <div onclick="showModernToast('Funcionalidad de agregar tarjeta disponible próximamente.', 'success')" style="padding: 1.25rem; border: 1px dashed var(--border-color); border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; min-height: 80px;">
              <span style="color: var(--primary); font-weight: 600; font-size: 0.95rem;">+ Agregar tarjeta</span>
            </div>
          </div>
        </div>
      `;
      }

      function renderFavorites(panel) {
        panel.innerHTML = `
        <div>
          <h2 style="font-size: 1.8rem; font-weight: 800; fontFamily: var(--font-serif); margin-bottom: 1.5rem;">Mis piezas favoritas</h2>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
            <div style="border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; display: flex; gap: 1rem; padding: 1rem;">
              <img src="img/producto-mochila-wayuu-1.png" alt="Mochila Wayuu" style="width: 80px; height: 80px; border-radius: 8px; object-fit: cover;" onerror="this.src='img/mochila_wayuu.png'" />
              <div style="display: flex; flex-direction: column; justify-content: center;">
                <h4 style="margin: 0; font-weight: 700;">Mochila Wayuu Colores del Sol</h4>
                <span style="color: var(--primary); font-weight: 700; margin: 0.25rem 0;">${formatCOP(280000)}</span>
                <a href="producto.html?id=1" style="font-size: 0.8rem; color: var(--secondary); font-weight: 600;">Ver pieza en catálogo</a>
              </div>
            </div>
          </div>
        </div>
      `;
      }

      function triggerLogout() {
        showModernConfirm(
          "¿Estás seguro de que deseas cerrar sesión?",
          function () {
            logoutUser();
            showModernToast("Sesión cerrada. ¡Hasta pronto!", "success");
            setTimeout(() => {
              window.location.replace("../home/index.html");
            }, 1200);
          },
        );
      }
    </script>
  </body>
</html>
