<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Categorías - Artesanías Chigorodó</title>
    <link rel="stylesheet" href="/frontend/css/styles.css" />
    <link rel="stylesheet" href="/frontend/css/navbar.css" />
    <link rel="stylesheet" href="/frontend/css/footer.css" />
    <link rel="stylesheet" href="/frontend/css/categorias.css" />
  </head>
  <body>
    <div class="app-shell">
      <!-- Navbar Header -->
      <div id="navbar-placeholder"></div>

      <!-- Main Content -->
      <div class="app-main-content">
        <main class="categories-page-container">
          <header class="section-header">
            <h1>Categorías</h1>
            <p>Explora nuestras categorías y encuentra piezas únicas</p>
          </header>

          <section class="categories-grid">
            <a href="productos.html?category=Tejidos" class="category-card">
              <div class="category-image-wrapper">
                <img
                  src="/frontend/img/categoria-tejidos.png"
                  alt="Tejidos"
                  class="category-img"
                />
              </div>
              <div class="category-text-box">
                <h3>Tejidos</h3>
                <p>Tradición que se entrelaza</p>
              </div>
            </a>
            <a
              href="productos.html?category=Cer%C3%A1mica"
              class="category-card"
            >
              <div class="category-image-wrapper">
                <img
                  src="img/categoria-ceramica.png"
                  alt="Cerámica"
                  class="category-img"
                />
              </div>
              <div class="category-text-box">
                <h3>Cerámica</h3>
                <p>Arte que perdura</p>
              </div>
            </a>
            <a
              href="productos.html?category=Joyer%C3%ADa"
              class="category-card"
            >
              <div class="category-image-wrapper">
                <img
                  src="img/categoria-joyeria.png"
                  alt="Joyería"
                  class="category-img"
                />
              </div>
              <div class="category-text-box">
                <h3>Joyería</h3>
                <p>Belleza artesanal</p>
              </div>
            </a>
            <a href="productos.html?category=Madera" class="category-card">
              <div class="category-image-wrapper">
                <img
                  src="img/categoria-madera.png"
                  alt="Madera"
                  class="category-img"
                />
              </div>
              <div class="category-text-box">
                <h3>Madera</h3>
                <p>Tallado con historia</p>
              </div>
            </a>
            <a
              href="productos.html?category=Hogar%20y%20Decoraci%C3%B3n"
              class="category-card"
            >
              <div class="category-image-wrapper">
                <img
                  src="img/categoria-hogar-decoracion.png"
                  alt="Hogar y Decoración"
                  class="category-img"
                />
              </div>
              <div class="category-text-box">
                <h3>Hogar y Decoración</h3>
                <p>Dale vida a tus espacios</p>
              </div>
            </a>
            <a href="productos.html?category=Accesorios" class="category-card">
              <div class="category-image-wrapper">
                <img
                  src="img/categoria-accesorios.png"
                  alt="Accesorios"
                  class="category-img"
                />
              </div>
              <div class="category-text-box">
                <h3>Accesorios</h3>
                <p>Detalles que enamoran</p>
              </div>
            </a>
          </section>
        </main>
      </div>

      <!-- Footer Element -->
      <div id="footer-placeholder"></div>
    </div>

    <!-- Scripts -->
    <script src="/frontend/js/core/main.js"></script>
    <script src="/frontend/js/components/productos.js"></script>
    <script src="/frontend/js/core/auth.js"></script>
    <script src="/frontend/js/components/carrito.js"></script>
    <script src="/frontend/js/components/navbar.js"></script>
    <script src="/frontend/js/components/footer.js"></script>
  </body>
</html>
