<div
  style="
    background: white;
    padding: 2rem;
    border-radius: 16px;
    box-shadow: var(--shadow);
    max-width: 680px;
    margin: 0 auto;
  "
>
  <h3
    style="
      font-size: 1.25rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 0.25rem;
    "
  >
    Configuración del Taller
  </h3>
  <p style="color: #64748b; font-size: 0.85rem; margin-bottom: 1.5rem">
    Administra los datos de tu taller, tu cuenta de cobro y tus preferencias de
    notificación.
  </p>

  <form
    onsubmit="
      event.preventDefault();
      showModernToast('¡Configuraciones guardadas con éxito!', 'success');
    "
  >
    <p class="aa-section-title">Datos del taller</p>

    <div class="aa-form-grid-2">
      <div>
        <label class="aa-label">Nombre del Taller / Marca</label>
        <input type="text" class="aa-input"  required />
      </div>
      <div>
        <label class="aa-label">Artesano Responsable</label>
        <input
          type="text"
          class="aa-input"
          placeholder="Nombre del artesano responsable"
          required
        />
      </div>
    </div>

    <div class="aa-form-grid-2">
      <div>
        <label class="aa-label">Especialidad Artesanal</label>
        <select class="aa-select">
          <option value="TEJIDO_WAYUU" selected>Tejido Wayuu</option>
          <option>Alfarería y Barro</option>
          <option>Ebanistería y Madera</option>
          <option>Joyería Artesanal</option>
          <option>Accesorios</option>
        </select>
      </div>
      <div>
        <label class="aa-label">Ciudad / Región</label>
        <input type="text" class="aa-input"  />
      </div>
    </div>

    <div class="aa-form-group">
      <label class="aa-label">Historia del Taller</label>
      <textarea class="aa-textarea" placeholder="Describe la historia, técnicas y valores de tu taller artesanal..."></textarea>
      <span class="aa-hint"
        >Se muestra en tu perfil público de "Nuestros Artesanos".</span
      >
    </div>

    <p class="aa-section-title">Contacto y notificaciones</p>

    <div class="aa-form-group">
      <label class="aa-label">Correo Electrónico para Alertas</label>
      <input
        type="email"
        class="aa-input"
        
        required
      />
    </div>

    <div class="aa-form-group">
      <label class="aa-label"
        >Número Telefónico de Notificaciones (WhatsApp)</label
      >
      <input type="text" class="aa-input"  required />
    </div>

    <div class="aa-form-group">
      <label class="aa-checkbox-row">
        <input type="checkbox" />
        Recibir notificación por correo cuando entre un pedido nuevo
      </label>
      <label class="aa-checkbox-row">
        <input type="checkbox" />
        Recibir notificación por WhatsApp cuando un pedido esté listo para
        despachar
      </label>
      <label class="aa-checkbox-row">
        <input type="checkbox" />
        Recibir resumen semanal de ventas y estadísticas
      </label>
    </div>

    <p class="aa-section-title">Cuenta de cobro</p>

    <div class="aa-form-grid-2">
      <div>
        <label class="aa-label">Documento (NIT / Cédula)</label>
        <input type="text" class="aa-input"  required />
      </div>
      <div>
        <label class="aa-label">Tipo de Cuenta</label>
        <select class="aa-select">
          <option selected>Ahorros</option>
          <option>Corriente</option>
        </select>
      </div>
    </div>

    <div class="aa-form-grid-2">
      <div>
        <label class="aa-label">Banco</label>
        <input type="text" class="aa-input"  />
      </div>
      <div>
        <label class="aa-label">Número de Cuenta</label>
        <input type="text" class="aa-input" placeholder="Número de cuenta bancaria" required />
      </div>
    </div>

    <p class="aa-section-title">Preferencias de despacho</p>

    <div class="aa-form-grid-2">
      <div>
        <label class="aa-label">Tiempo Promedio de Despacho (días)</label>
        <input type="number" class="aa-input"  min="1" />
      </div>
      <div>
        <label class="aa-label">Ciudad de Origen del Envío</label>
        <input type="text" class="aa-input"  />
      </div>
    </div>

    <button
      type="submit"
      style="
        width: 100%;
        background: var(--color-active);
        color: white;
        border: none;
        padding: 0.85rem;
        border-radius: 8px;
        font-weight: 700;
        cursor: pointer;
        font-family: inherit;
        margin-top: 0.5rem;
      "
    >
      Guardar Configuración
    </button>
  </form>
</div>
