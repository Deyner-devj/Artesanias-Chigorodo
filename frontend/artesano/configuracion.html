<div
  style="
    background: white;
    padding: 2rem;
    border-radius: 16px;
    box-shadow: var(--shadow);
    max-width: 600px;
    margin: 0 auto;
  "
>
  <h3
    style="
      font-size: 1.25rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 0.25rem;
    "
  >
    Configuraciones Técnicas
  </h3>
  <p style="color: #64748b; font-size: 0.85rem; margin-bottom: 1.5rem">
    Modifica tus datos de contacto y la cuenta de cobro de tus ventas.
  </p>

  <form
    onsubmit="
      event.preventDefault();
      alert('¡Configuraciones guardadas!');
    "
  >
    <div style="margin-bottom: 1.25rem">
      <label
        style="
          display: block;
          font-size: 0.8rem;
          font-weight: 700;
          color: #475569;
          margin-bottom: 0.5rem;
        "
        >Correo Electrónico para Alertas</label
      >
      <input
        type="email"
        value="contacto@artesaniaschigorodo.com"
        required
        style="
          width: 100%;
          padding: 0.75rem;
          border: 1px solid #cbd5e1;
          border-radius: 8px;
          font-family: inherit;
          font-size: 0.9rem;
        "
      />
    </div>

    <div style="margin-bottom: 1.25rem">
      <label
        style="
          display: block;
          font-size: 0.8rem;
          font-weight: 700;
          color: #475569;
          margin-bottom: 0.5rem;
        "
        >Número Telefónico de Notificaciones (WhatsApp)</label
      >
      <input
        type="text"
        value="+57 312 456 7890"
        required
        style="
          width: 100%;
          padding: 0.75rem;
          border: 1px solid #cbd5e1;
          border-radius: 8px;
          font-family: inherit;
          font-size: 0.9rem;
        "
      />
    </div>

    <div style="margin-bottom: 1.5rem">
      <label
        style="
          display: block;
          font-size: 0.8rem;
          font-weight: 700;
          color: #475569;
          margin-bottom: 0.5rem;
        "
        >Cuenta Bancaria para Transferencias (COP)</label
      >
      <input
        type="text"
        value="Ahorros Bancolombia - Nº ***-****87-45"
        required
        style="
          width: 100%;
          padding: 0.75rem;
          border: 1px solid #cbd5e1;
          border-radius: 8px;
          font-family: inherit;
          font-size: 0.9rem;
        "
      />
    </div>

    <button
      type="submit"
      style="
        width: 100%;
        background: var(--color-active);
        color: white;
        border: none;
        padding: 0.75rem;
        border-radius: 8px;
        font-weight: 700;
        cursor: pointer;
        font-family: inherit;
      "
    >
      Actualizar Ajustes Técnicos
    </button>
  </form>
</div>
