<div
  style="
    background: white;
    padding: 2rem;
    border-radius: 16px;
    box-shadow: var(--shadow);
  "
>
  <div
    style="
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    "
  >
    <div>
      <h3 style="font-size: 1.25rem; font-weight: 800; color: #0f172a">
        Mis Productos
      </h3>
      <p style="color: #64748b; font-size: 0.85rem">
        Lista completa de artesanías registradas en la plataforma.
      </p>
    </div>
    <button
      onclick="loadView('agregar-producto')"
      style="
        background-color: var(--color-active);
        color: white;
        border: none;
        padding: 0.6rem 1.2rem;
        border-radius: 8px;
        font-weight: 700;
        cursor: pointer;
        font-family: inherit;
        font-size: 0.85rem;
      "
    >
      + Añadir Nueva Pieza
    </button>
  </div>

  <table
    style="
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    "
  >
    <thead>
      <tr style="border-bottom: 2px solid #e2e8f0; color: #64748b">
        <th style="padding: 1rem 0.5rem">Producto</th>
        <th style="padding: 1rem 0.5rem">Categoría</th>
        <th style="padding: 1rem 0.5rem">Precio</th>
        <th style="padding: 1rem 0.5rem">Stock</th>
        <th style="padding: 1rem 0.5rem; text-align: right">Acción</th>
      </tr>
    </thead>
    <tbody>
      <td colspan="4">Cargando productos...</td>
    </tbody>
  </table>
</div>
