<div
  style="
    background: white;
    padding: 2rem;
    border-radius: 16px;
    box-shadow: var(--shadow);
  "
>
  <div
    style="
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    "
  >
    <div>
      <h3 style="font-size: 1.25rem; font-weight: 800; color: #0f172a">
        Mis Productos
      </h3>
      <p style="color: #64748b; font-size: 0.85rem">
        Lista completa de artesanías registradas en la plataforma.
      </p>
    </div>
    <button
      onclick="loadView('agregar-producto')"
      style="
        background-color: var(--color-active);
        color: white;
        border: none;
        padding: 0.6rem 1.2rem;
        border-radius: 8px;
        font-weight: 700;
        cursor: pointer;
        font-family: inherit;
        font-size: 0.85rem;
      "
    >
      + Añadir Nueva Pieza
    </button>
  </div>

  <table
    style="
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    "
  >
    <thead>
      <tr style="border-bottom: 2px solid #e2e8f0; color: #64748b">
        <th style="padding: 1rem 0.5rem">Producto</th>
        <th style="padding: 1rem 0.5rem">Categoría</th>
        <th style="padding: 1rem 0.5rem">Precio</th>
        <th style="padding: 1rem 0.5rem">Stock</th>
        <th style="padding: 1rem 0.5rem; text-align: right">Acción</th>
      </tr>
    </thead>
    <tbody>
      <tr style="border-bottom: 1px solid #f1f5f9">
        <td style="padding: 1rem 0.5rem; font-weight: 700; color: #0f172a">
          Mochila Wayuu Colores de Urabá
        </td>
        <td style="padding: 1rem 0.5rem; color: #64748b">Tejidos</td>
        <td
          style="
            padding: 1rem 0.5rem;
            font-weight: 600;
            color: var(--color-active);
          "
        >
          $240.000
        </td>
        <td style="padding: 1rem 0.5rem">12 unidades</td>
        <td style="padding: 1rem 0.5rem; text-align: right">
          <button
            onclick="loadView('editar-productos')"
            style="
              background: none;
              border: none;
              color: #3b82f6;
              font-weight: 700;
              cursor: pointer;
              font-family: inherit;
              margin-right: 10px;
            "
          >
            Editar
          </button>
        </td>
      </tr>
      <tr style="border-bottom: 1px solid #f1f5f9">
        <td style="padding: 1rem 0.5rem; font-weight: 700; color: #0f172a">
          Sombrero Vueltiao Tradicional
        </td>
        <td style="padding: 1rem 0.5rem; color: #64748b">Tejidos</td>
        <td
          style="
            padding: 1rem 0.5rem;
            font-weight: 600;
            color: var(--color-active);
          "
        >
          $180.000
        </td>
        <td style="padding: 1rem 0.5rem">5 unidades</td>
        <td style="padding: 1rem 0.5rem; text-align: right">
          <button
            onclick="loadView('editar-productos')"
            style="
              background: none;
              border: none;
              color: #3b82f6;
              font-weight: 700;
              cursor: pointer;
              font-family: inherit;
              margin-right: 10px;
            "
          >
            Editar
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
