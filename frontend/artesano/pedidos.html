<div
  style="
    background: white;
    padding: 2rem;
    border-radius: 16px;
    box-shadow: var(--shadow);
  "
>
  <h3
    style="
      font-size: 1.25rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 0.25rem;

    Control de Pedidos
  </h3>
  <p style="color: #64748b; font-size: 0.85rem; margin-bottom: 1.5rem">

  <table

      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;

    <thead>
      <tr style="border-bottom: 2px solid #e2e8f0; color: #64748b">

        <th style="padding: 1rem 0.5rem">Producto comprado</th>
        <th style="padding: 1rem 0.5rem">Fecha</th>
        <th style="padding: 1rem 0.5rem">Total pagado</th>
        <th style="padding: 1rem 0.5rem; text-align: right; width: 180px">

        </th>
      </tr>
    </thead>
    <tbody>
      <td colspan="5">Cargando pedidos...</td>
    </tbody>
