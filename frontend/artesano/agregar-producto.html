<div
  style="
    background: white;
    padding: 2rem;
    border-radius: 16px;
    box-shadow: var(--shadow);
    max-width: 650px;
    margin: 0 auto;
  "
>
  <h3
    style="
      font-size: 1.25rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 0.25rem;
    "
  >
    Agregar Nuevo Producto
  </h3>
  <p style="color: #64748b; font-size: 0.85rem; margin-bottom: 1.5rem">
    Registra una obra artesanal para exponerla en el mercado.
  </p>

  <form
    onsubmit="
      event.preventDefault();
      showModernToast('\u00a1Artesan\u00eda guardada en el cat\u00e1logo exitosamente!', 'success');
      loadView('productos');
    "
  >
    <div style="margin-bottom: 1.25rem">
      <label
        style="
          display: block;
          font-size: 0.8rem;
          font-weight: 700;
          color: #475569;
          margin-bottom: 0.5rem;
        "
        >Nombre de la Artesanía</label
      >
      <input
        type="text"
        placeholder="Ej. Mochila Wayuu de Hilos de Algodón"
        required
        style="
          width: 100%;
          padding: 0.75rem;
          border: 1px solid #cbd5e1;
          border-radius: 8px;
          font-family: inherit;
          font-size: 0.9rem;
        "
      />
    </div>

    <div
      style="
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        margin-bottom: 1.25rem;
      "
    >
      <div>
        <label
          style="
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: #475569;
            margin-bottom: 0.5rem;
          "
          >Categoría</label
        >
        <select
          style="
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.9rem;
            background: white;
          "
        >
          <option>Tejidos</option>
          <option>Alfarería y Barro</option>
          <option>Ebanistería y Madera</option>
          <option>Joyería Tradicional</option>
        </select>
      </div>
      <div>
        <label
          style="
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: #475569;
            margin-bottom: 0.5rem;
          "
          >Material Principal</label
        >
        <input
          type="text"
          placeholder="Ej. Paja Tetera, Arcilla"
          style="
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.9rem;
          "
        />
      </div>
    </div>

    <div
      style="
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        margin-bottom: 1.5rem;
      "
    >
      <div>
        <label
          style="
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: #475569;
            margin-bottom: 0.5rem;
          "
          >Precio de Venta (COP)</label
        >
        <input
          type="number"
          placeholder="150000"
          required
          style="
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.9rem;
          "
        />
      </div>
      <div>
        <label
          style="
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: #475569;
            margin-bottom: 0.5rem;
          "
          >Cantidad Inicial en Stock</label
        >
        <input
          type="number"
          placeholder="5"
          required
          style="
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.9rem;
          "
        />
      </div>
    </div>

    <div style="margin-bottom: 1.5rem">
      <label
        style="
          display: block;
          font-size: 0.8rem;
          font-weight: 700;
          color: #475569;
          margin-bottom: 0.5rem;
        "
        >Descripción de la Técnica o Historia</label
      >
      <textarea
        rows="3"
        placeholder="Describe brevemente la herencia familiar impregnada en este producto..."
        style="
          width: 100%;
          padding: 0.75rem;
          border: 1px solid #cbd5e1;
          border-radius: 8px;
          font-family: inherit;
          font-size: 0.9rem;
          resize: none;
        "
      ></textarea>
    </div>

    <div style="display: flex; gap: 1rem">
      <button
        type="button"
        onclick="loadView('productos')"
        style="
          flex: 1;
          background: #f1f5f9;
          color: #475569;
          border: none;
          padding: 0.75rem;
          border-radius: 8px;
          font-weight: 700;
          cursor: pointer;
          font-family: inherit;
        "
      >
        Cancelar
      </button>
      <button
        type="submit"
        style="
          flex: 2;
          background: var(--color-active);
          color: white;
          border: none;
          padding: 0.75rem;
          border-radius: 8px;
          font-weight: 700;
          cursor: pointer;
          font-family: inherit;
        "
      >
        Publicar en Tienda
      </button>
    </div>
  </form>
</div>
