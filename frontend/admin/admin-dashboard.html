<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard · Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="../css/admin/admin.css" />
    <!-- Íconos Inteligentes -->
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body data-page-title="Dashboard">
    <div
      class="sidebar-overlay"
      id="sidebar-overlay"
      onclick="closeMobileSidebar()"
    ></div>

    <div class="dash-shell">
      <div id="dash-sidebar-container"></div>

      <div class="dash-main">
        <div id="dash-topbar-container"></div>

        <div class="dash-content">
          <div class="dashboard-grid">
            <div class="card">
              <div class="card-icon-box orange">
                <i data-lucide="banknote"></i>
              </div>
              <div class="card-title">Ventas Totales</div>
              <div class="card-value" id="admin-total-sales">—</div>
            </div>
            <div class="card">
              <div class="card-icon-box blue">
                <i data-lucide="clipboard-list"></i>
              </div>
              <div class="card-title">Pedidos Pendientes</div>
              <div class="card-value" id="admin-pending-orders">—</div>
            </div>
            <div class="card">
              <div class="card-icon-box green">
                <i data-lucide="shopping-bag"></i>
              </div>
              <div class="card-title">Productos Activos</div>
              <div class="card-value" id="admin-total-products">—</div>
            </div>
            <div class="card">
              <div class="card-icon-box purple">
                <i data-lucide="user-check"></i>
              </div>
              <div class="card-title">Artesanos Registrados</div>
              <div class="card-value" id="admin-total-artisans">—</div>
            </div>
          </div>

          <div class="content-card" style="margin-top: 24px">
            <div
              style="
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 18px;
              "
            >
              <div>
                <div class="card-title" style="margin-bottom: 4px">
                  Actividad reciente
                </div>
                <div class="card-subtitle">
                  Últimos pedidos registrados en la plataforma
                </div>
              </div>
            </div>
            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Pedido</th>
                    <th>Cliente</th>
                    <th>Total</th>
                    <th>Estado</th>
                  </tr>
                </thead>
                <tbody id="admin-recent-orders">
                  <tr><td colspan="4">Cargando pedidos recientes...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
    <script src="../js/core/main.js"></script>
    <script src="../js/core/api.js"></script>
    <script src="../js/admin/admin-dashboard.js"></script>
    <script src="../js/admin/main-admin.js"></script>
  </body>
</html>
