<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Productos · Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="../css/admin/admin.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body data-page-title="Productos">
    <div
      class="sidebar-overlay"
      id="sidebar-overlay"
      onclick="closeMobileSidebar()"
    ></div>

    <div class="dash-shell">
      <div id="dash-sidebar-container"></div>

      <div class="dash-main">
        <div id="dash-topbar-container"></div>

        <div class="dash-content">
          <div class="content-card">
            <div
              style="
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                margin-bottom: 20px;
                gap: 1rem;
                flex-wrap: wrap;
              "
            >
              <div>
                <div class="card-title" style="margin-bottom: 4px">
                  Inventario de Productos
                </div>
                <div class="card-subtitle">
                  Carga productos, edita detalles, actualiza el stock y los
                  precios.
                </div>
              </div>
              <button
                id="btn-new-product"
                class="icon-btn"
                style="
                  width: auto;
                  padding: 0.6rem 1rem;
                  background: var(--primary, #d97706);
                  color: #fff;
                  display: flex;
                  align-items: center;
                  gap: 0.4rem;
                "
              >
                <i data-lucide="plus"></i> Nuevo producto
              </button>
            </div>
            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Producto</th>
                    <th>Categoría</th>
                    <th>Artesano</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                  </tr>
                </thead>
                <tbody id="admin-products-table-body">
                  <tr>
                    <td colspan="7">Cargando productos...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="../js/core/main.js"></script>
    <script src="../js/core/api.js"></script>
    <script src="../js/admin/admin-dashboard.js"></script>
    <script src="../js/admin/main-admin.js"></script>
    <script src="../js/admin/productos.js"></script>
  </body>
</html>
