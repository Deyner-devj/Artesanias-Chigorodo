<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard · Admin</title>
    <link rel="stylesheet" href="../css/admin/admin.css" />
    <!-- Íconos Inteligentes -->
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body data-page-title="Dashboard">
    <div
      class="sidebar-overlay"
      id="sidebar-overlay"
      onclick="closeMobileSidebar()"
    ></div>

    <div class="dash-shell">
      <div id="dash-sidebar-container"></div>

      <div class="dash-main">
        <div id="dash-topbar-container"></div>

        <div class="dash-content">
          <div class="dashboard-grid">
            <div class="card">
              <div class="card-title">Ventas Totales</div>
              <div class="card-value">$4,250,000</div>
            </div>
            <div class="card">
              <div class="card-title">Pedidos Pendientes</div>
              <div class="card-value">12</div>
            </div>
            <div class="card">
              <div class="card-title">Productos Activos</div>
              <div class="card-value">148</div>
            </div>
            <div class="card">
              <div class="card-title">Artesanos Registrados</div>
              <div class="card-value">34</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="../js/admin/dashboard-loader.js"></script>
  </body>
</html>
