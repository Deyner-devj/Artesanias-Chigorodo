<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Perfil · Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="../css/admin/admin.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body data-page-title="Mi Perfil">
    <div
      class="sidebar-overlay"
      id="sidebar-overlay"
      onclick="closeMobileSidebar()"
    ></div>

    <div class="dash-shell">
      <div id="dash-sidebar-container"></div>

      <div class="dash-main">
        <div id="dash-topbar-container"></div>

        <div class="dash-content">
          <div class="content-card config-card">
            <div class="config-header">
              <div class="config-icon-wrapper">
                <i data-lucide="user" style="color: #c46b2d"></i>
              </div>
              <div>
                <div class="config-card-title">Mi Perfil</div>
                <div class="config-card-subtitle">
                  Actualiza tus datos de contacto, contraseña y avatar
                  personal.
                </div>
              </div>
            </div>

            <div
              style="
                display: flex;
                align-items: center;
                gap: 16px;
                margin-bottom: 24px;
              "
            >
              <div class="sidebar-avatar" style="width: 64px; height: 64px; font-size: 1.3rem">
                DC
              </div>
              <div>
                <div class="font-semibold" style="font-size: 1.05rem">
                  Deyner Chaverra
                </div>
                <div class="card-subtitle">Administrador general</div>
              </div>
            </div>

            <div class="option-group">
              <label
                >Nombre completo
                <input
                  type="text"
                  class="custom-datetime-input"
                  value="Deyner Chaverra"
                  style="margin-top: 6px"
                />
              </label>
              <label
                >Correo electrónico
                <input
                  type="email"
                  class="custom-datetime-input"
                  value="admin@chigorodo.test"
                  style="margin-top: 6px"
                />
              </label>
              <label
                >Nueva contraseña
                <input
                  type="password"
                  class="custom-datetime-input"
                  placeholder="••••••••"
                  style="margin-top: 6px"
                />
              </label>
            </div>

            <div class="actions-row">
              <button class="btn btn-save">Guardar cambios</button>
              <button class="btn btn-disable">Cancelar</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="../js/admin/admin-dashboard.js"></script>
    <script src="../js/admin/main-admin.js"></script>
  </body>
</html>
