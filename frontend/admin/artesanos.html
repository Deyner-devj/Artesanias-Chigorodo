<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artesanos · Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="../css/admin/admin.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body data-page-title="Artesanos">
    <div
      class="sidebar-overlay"
      id="sidebar-overlay"
      onclick="closeMobileSidebar()"
    ></div>

    <div class="dash-shell">
      <div id="dash-sidebar-container"></div>

      <div class="dash-main">
        <div id="dash-topbar-container"></div>

        <div class="dash-content">
          <div class="content-card">
            <div style="margin-bottom: 20px">
              <div class="card-title" style="margin-bottom: 4px">
                Gestión de Artesanos
              </div>
              <div class="card-subtitle">
                Visualiza, añade y aprueba perfiles de artesanos locales.
              </div>
            </div>
            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Artesano / Taller</th>
                    <th>Correo</th>
                    <th>Productos</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                  </tr>
                </thead>
                <tbody id="artisans-table-body">
                  <tr>
                    <td colspan="5">Cargando artesanos...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="../js/core/main.js"></script>
    <script src="../js/core/api.js"></script>
    <script src="../js/admin/admin-dashboard.js"></script>
    <script src="../js/admin/main-admin.js"></script>
    <script src="../js/admin/artesanos.js"></script>
  </body>
</html>
