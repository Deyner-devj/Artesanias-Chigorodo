services:
  mysql:
    image: mysql:8.0
    container_name: artesanias-mysql
    environment:
      MYSQL_DATABASE: artesanias_chigorodo
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    command: --wait_timeout=240

  mongodb:
    image: mongo:6.0
    container_name: artesanias-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./mongo:/docker-entrypoint-initdb.d
    networks:
      - app-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet | grep 1
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  backend:
    build: .
    container_name: artesanias-backend
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: artesanias_chigorodo
      DB_USERNAME: root
      DB_PASSWORD: root
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DB: artesanias_chigorodo
      APP_CORS_ALLOWED_ORIGINS: "http://localhost:5500,http://127.0.0.1:5500,http://localhost:5501,http://127.0.0.1:5501,http://localhost:8080,http://127.0.0.1:8080,http://localhost:3000,http://127.0.0.1:3000,http://localhost:80,http://127.0.0.1,http://localhost:5502,http://127.0.0.1:5502"
      APP_BASE_URL: "http://localhost:8080"
    networks:
      - app-network

volumes:
  mysql-data:
  mongo-data:

networks:
  app-network:
    driver: bridge
