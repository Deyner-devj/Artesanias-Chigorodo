spring.application.name=artesanias-chigorodo
server.port=8080

# =============================================================
# CONFIGURACIÓN DE DOBLE BASE DE DATOS
# MySQL (SQL) - Datos relacionales principales
# MongoDB (NoSQL) - Auditoría de seguridad y eventos operativos
# =============================================================

# --- MySQL (JPA) ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:artesanias_chigorodo}?createDatabaseIfNotExist=true&useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&requireSSL=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# HikariCP connection pool configuration for Docker
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.maximum-pool-size=10

# --- MongoDB ---
spring.data.mongodb.uri=mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:artesanias_chigorodo}?connectTimeoutMS=30000&socketTimeoutMS=30000

# JWT Configurations
security.jwt.secret-key=${SECURITY_JWT_SECRET_KEY}
security.jwt.expiration-time=${SECURITY_JWT_EXPIRATION_TIME:86400000}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# CORS - Configurar en produccion con dominios especificos
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5500,http://localhost:5501,http://localhost:5502}

# Configuración de almacenamiento de imágenes
app.upload.dir=uploads
app.base-url=${APP_BASE_URL:http://localhost:8080}

# =============================================================
# CONFIGURACIÓN DE CORREO (JavaMailSender)
# =============================================================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true