spring.application.name=artesanias-chigorodo
server.port=8080

# =============================================================
# CONFIGURACIÓN DE DOBLE BASE DE DATOS
# MySQL (SQL) - Datos relacionales principales
# MongoDB (NoSQL) - Auditoria de seguridad y eventos operativos.
# =============================================================

# --- MySQL (JPA) ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:artesanias_chigorodo}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- MongoDB (Documentos no relacionales) ---
spring.data.mongodb.uri=mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:artesanias_chigorodo}

# JWT Configurations
# SEGURIDAD: En producción SIEMPRE definir SECURITY_JWT_SECRET_KEY como variable de entorno.
# La clave por defecto solo debe usarse en entornos de desarrollo local.
security.jwt.secret-key=${SECURITY_JWT_SECRET_KEY:YXJ0ZXNhbmlhc2NoaWdvcm9kb3NlY3JldGtleWZvcmp3dHRva2VuZ2VuZXJhdGlvbjIwMjY=}
security.jwt.expiration-time=${SECURITY_JWT_EXPIRATION_TIME:86400000}

# Actuator
# /actuator/** protegido por rol ADMIN (configurado en SecurityConfig.java)
management.endpoints.web.exposure.include=health,info,metrics

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

# Admin credentials (solo fallback local — en producción usar variables de entorno)
# ADMIN_EMAIL y ADMIN_PASSWORD son leídos por DataInitializer
