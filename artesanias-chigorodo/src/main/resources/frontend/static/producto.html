<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <title>Detalle de Producto - Artesanías Chigorodó</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/navbar.css" />
  <link rel="stylesheet" href="css/footer.css" />
  <link rel="stylesheet" href="css/producto.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Navbar Header -->
    <div id="navbar-placeholder"></div>

    <!-- Main Content -->
    <div class="app-main-content">
      <main class="page product-detail-page-container" id="detail-page-container">
        <!-- Will be loaded dynamically via JS -->
        <div class="empty-state" id="loader-container">
          <div class="loader-spinner"></div>
          <p>Cargando detalles de la artesanía...</p>
        </div>
      </main>
    </div>

    <!-- Footer Element -->
    <div id="footer-placeholder"></div>
  </div>

  <!-- Scripts -->
  <script src="js/main.js"></script>
  <script src="js/productos.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/carrito.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/footer.js"></script>

  <script>
    let currentProduct = null;
    let selectedColor = 'Multicolor';
    let quantity = 1;
    let activeImage = '';

    document.addEventListener('DOMContentLoaded', function() {
      loadProductDetails();
    });

    function loadProductDetails() {
      const params = getQueryParams();
      const productId = params.get('id');

      const container = document.getElementById('detail-page-container');
      
      if (!productId) {
        renderProductNotFound();
        return;
      }

      currentProduct = getProductById(productId);
      if (!currentProduct) {
        renderProductNotFound();
        return;
      }

      // Initialize image
      activeImage = currentProduct.image;
      renderDetails();
    }

    function renderProductNotFound() {
      const container = document.getElementById('detail-page-container');
      container.innerHTML = `
        <div class="empty-state">
          <p>No se pudo encontrar la artesanía especificada.</p>
          <a href="productos.html" class="btn btn-primary">Volver al catálogo</a>
        </div>
      `;
    }

    function renderStars(rating) {
      const floorRating = Math.floor(rating);
      let starsHtml = '';
      for (let i = 1; i <= 5; i++) {
        const fill = i <= floorRating ? 'var(--primary)' : 'none';
        const stroke = i <= floorRating ? 'var(--primary)' : 'var(--border-color)';
        starsHtml += `
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="${fill}" color="${stroke}" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
        `;
      }
      return `<div style="display: flex; gap: 3px; align-items: center;">${starsHtml}</div>`;
    }

    function renderDetails() {
      const container = document.getElementById('detail-page-container');
      
      // Determine gallery images
      const galleryImages = currentProduct.id === '1'
        ? [
            'img/producto-mochila-wayuu-1.png',
            'img/producto-mochila-wayuu-2.png',
            'img/producto-mochila-wayuu-3.png',
            'img/producto-mochila-wayuu-4.png'
          ]
        : [
            currentProduct.image,
            'img/individual_tejido.png',
            'img/jarron_barro.png'
          ];

      let thumbnailsHtml = '';
      galleryImages.forEach(img => {
        const isActive = activeImage === img;
        const borderStyle = isActive ? '2.5px solid var(--primary)' : '1px solid var(--border-color)';
        thumbnailsHtml += `
          <button 
            type="button"
            onclick="changeActiveImage('${img}')"
            style="width: 74px; height: 74px; border: ${borderStyle}; border-radius: 8px; overflow: hidden; cursor: pointer; padding: 0; background-color: var(--bg-secondary);"
          >
            <img src="${img}" alt="" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.src='img/mochila_wayuu.png'" />
          </button>
        `;
      });

      const isStockAvailable = currentProduct.stock > 0;
      const disabledAttr = isStockAvailable ? '' : 'disabled';

      container.innerHTML = `
        <div class="detail-breadcrumb" style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 2rem;">
          <a href="index.html" style="color: var(--text-muted);">Inicio</a> / 
          <a href="productos.html?category=${encodeURIComponent(currentProduct.category)}" style="color: var(--text-muted);">${currentProduct.category}</a> / 
          Mochilas / 
          <span class="active-item" style="color: var(--text-dark); font-weight: 600;">${currentProduct.name}</span>
        </div>

        <article class="detail-grid">
          <!-- Left Column: Gallery -->
          <div class="detail-gallery-container">
            <div class="detail-thumbnails">
              ${thumbnailsHtml}
            </div>
            <div class="detail-image-main">
              <img src="${activeImage}" alt="${currentProduct.name}" id="main-product-img" onerror="this.src='img/mochila_wayuu.png'" />
            </div>
          </div>

          <!-- Right Column: Info -->
          <div class="detail-info-panel">
            <h1 class="detail-product-title">${currentProduct.name}</h1>
            
            <div class="detail-rating-box">
              ${renderStars(currentProduct.rating)}
              <span class="reviews-count">(${currentProduct.reviewsCount} reseñas)</span>
            </div>

            <div class="detail-price-box">
              <span class="detail-price">${formatCOP(currentProduct.price)}</span>
            </div>

            <div class="detail-divider"></div>

            <div class="detail-description">
              <p>${currentProduct.description}</p>
            </div>

            <!-- Attributes -->
            <div class="detail-meta-checked-list">
              <div class="detail-meta-checked-item">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                <span>100% hecho a mano</span>
              </div>
              <div class="detail-meta-checked-item">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                <span>Material: Palma de Iraca y algodón orgánico</span>
              </div>
              <div class="detail-meta-checked-item">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                <span>Técnica: Tejeduría tradicional colombiana</span>
              </div>
            </div>

            <div class="detail-divider"></div>

            <!-- Color Selection -->
            <div class="detail-color-selection">
              <span class="selection-label">Color: <strong style="color: var(--text-dark);" id="selected-color-label">${selectedColor}</strong></span>
              <div class="color-circles">
                <button 
                  type="button" 
                  class="color-circle ${selectedColor === 'Multicolor' ? 'active' : ''}"
                  style="background: linear-gradient(45deg, #e82c2c, #ff7f00, #ffd700, #1B7A4D, #00c1d5, #0b428c);"
                  onclick="selectColor('Multicolor')"
                  aria-label="Multicolor"
                ></button>
                <button 
                  type="button" 
                  class="color-circle ${selectedColor === 'Terracota' ? 'active' : ''}"
                  style="background-color: #E8632C;"
                  onclick="selectColor('Terracota')"
                  aria-label="Terracota"
                ></button>
                <button 
                  type="button" 
                  class="color-circle ${selectedColor === 'Negro' ? 'active' : ''}"
                  style="background-color: #2B2118;"
                  onclick="selectColor('Negro')"
                  aria-label="Negro"
                ></button>
                <button 
                  type="button" 
                  class="color-circle ${selectedColor === 'Arena' ? 'active' : ''}"
                  style="background-color: #E5DFD6;"
                  onclick="selectColor('Arena')"
                  aria-label="Arena"
                ></button>
              </div>
            </div>

            <!-- Quantity Selector -->
            <div class="detail-qty-selection" style="display: flex; align-items: center; gap: 1rem;">
              <span class="selection-label">Cantidad:</span>
              <div class="qty-selector-group">
                <button type="button" onclick="changeQty(-1)" class="detail-qty-btn">-</button>
                <input 
                  type="text" 
                  id="qty-input"
                  value="${quantity}" 
                  readonly 
                  style="width: 40px; text-align: center; border: none; background: transparent; font-weight: 700; padding: 0; font-size: 0.95rem;" 
                />
                <button type="button" onclick="changeQty(1)" class="detail-qty-btn">+</button>
              </div>
            </div>

            <!-- Action Buttons -->
            <div class="detail-actions">
              <button 
                onclick="addToCart()" 
                class="btn btn-outline-orange btn-add-cart"
                ${disabledAttr}
              >
                Agregar al carrito
              </button>
              
              <button 
                onclick="buyNow()" 
                class="btn btn-secondary btn-buy-now"
                ${disabledAttr}
              >
                Comprar ahora
              </button>
            </div>

            <!-- Shipping Info -->
            <div class="detail-shipping-info-badge" style="display: flex; gap: 1.25rem; background-color: var(--bg-secondary); padding: 1.25rem; border-radius: 12px; border: 1px solid var(--border-color); margin-top: 2rem;">
              <div style="display: flex; gap: 0.85rem;">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--secondary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-top: 0.15rem;"><rect width="16" height="13" x="2" y="4" rx="2"></rect><path d="M16 7h4l3 3.5v5.5h-7Z"></path><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>
                <div class="shipping-text">
                  <h4 style="font-size: 0.95rem; font-weight: 700; margin: 0; color: var(--text-dark);">Envío a todo el país</h4>
                  <p style="font-size: 0.85rem; color: var(--text-muted); margin: 0.15rem 0 0;">Entrega estimada entre 2 a 5 días hábiles</p>
                </div>
              </div>
              <div style="display: flex; gap: 0.85rem; border-left: 1px solid var(--border-color); padding-left: 1.25rem;">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--secondary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-top: 0.15rem;"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><polyline points="3 3 3 8 8 8"></polyline><line x1="12" y1="7" x2="12" y2="12"></line><line x1="12" y1="12" x2="16" y2="14"></line></svg>
                <div class="shipping-text">
                  <h4 style="font-size: 0.95rem; font-weight: 700; margin: 0; color: var(--text-dark);">Devoluciones</h4>
                  <p style="font-size: 0.85rem; color: var(--text-muted); margin: 0.15rem 0 0;">Garantía de devolución hasta por 7 días</p>
                </div>
              </div>
            </div>
          </div>
        </article>
      `;
    }

    function changeActiveImage(img) {
      activeImage = img;
      renderDetails();
    }

    function selectColor(color) {
      selectedColor = color;
      document.getElementById('selected-color-label').textContent = color;
      
      // Update active state in color circles
      const circles = document.querySelectorAll('.color-circle');
      circles.forEach(c => {
        c.classList.remove('active');
        if (c.getAttribute('aria-label') === color) {
          c.classList.add('active');
        }
      });
    }

    function changeQty(amount) {
      quantity = Math.max(1, quantity + amount);
      document.getElementById('qty-input').value = quantity;
    }

    function addToCart() {
      if (currentProduct) {
        addProductToCart(currentProduct, quantity);
        alert(`¡${currentProduct.name} (${quantity}) agregado al carrito!`);
      }
    }

    function buyNow() {
      if (currentProduct) {
        addProductToCart(currentProduct, quantity);
        window.location.href = 'carrito.html';
      }
    }
  </script>
</body>
</html>
