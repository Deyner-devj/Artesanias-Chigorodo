<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet" />
  <title>Catálogo - Artesanías Chigorodó</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/navbar.css" />
  <link rel="stylesheet" href="css/footer.css" />
  <link rel="stylesheet" href="css/producto.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Navbar Header -->
    <div id="navbar-placeholder"></div>

    <!-- Main Content -->
    <div class="app-main-content">
      <main class="page products-page-container">
        <header class="products-header">
          <p class="eyebrow" id="eyebrow-text">Catálogo</p>
          <h1 id="catalog-title">Artesanías Disponibles</h1>
          <p class="products-subtitle">
            Explora piezas únicas diseñadas y elaboradas a mano por maestros artesanos colombianos.
          </p>
        </header>

        <!-- Catalog Container -->
        <section class="catalog-grid" id="catalog-grid-container">
          <!-- Will be loaded dynamically via JS -->
        </section>

        <!-- Empty State Container -->
        <div class="empty-state" id="empty-state-container" style="display: none;">
          <p>No se encontraron artesanías para este filtro.</p>
          <a href="productos.html" class="btn btn-primary">Ver todas las artesanías</a>
        </div>
      </main>
    </div>

    <!-- Footer Element -->
    <div id="footer-placeholder"></div>
  </div>

  <!-- Scripts -->
  <script src="js/main.js"></script>
  <script src="js/productos.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/carrito.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/footer.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      renderCatalog();
    });

    function renderCatalog() {
      const params = getQueryParams();
      const categoryFilter = params.get('category');
      const searchFilter = params.get('search');

      const titleEl = document.getElementById('catalog-title');
      const eyebrowEl = document.getElementById('eyebrow-text');
      const gridContainer = document.getElementById('catalog-grid-container');
      const emptyContainer = document.getElementById('empty-state-container');

      // Update titles
      if (categoryFilter) {
        titleEl.textContent = `Colección ${categoryFilter}`;
        eyebrowEl.textContent = 'Categoría';
      } else if (searchFilter) {
        titleEl.textContent = `Resultados para "${searchFilter}"`;
        eyebrowEl.textContent = 'Búsqueda';
      } else {
        titleEl.textContent = 'Artesanías Disponibles';
        eyebrowEl.textContent = 'Catálogo';
      }

      // Filter products
      const allProducts = getProducts();
      const filtered = allProducts.filter(prod => {
        if (categoryFilter && prod.category.toLowerCase() !== categoryFilter.toLowerCase()) {
          return false;
        }
        if (searchFilter) {
          const s = searchFilter.toLowerCase();
          const matchName = prod.name.toLowerCase().includes(s);
          const matchDesc = prod.description.toLowerCase().includes(s);
          const matchSeller = prod.sellerName.toLowerCase().includes(s);
          if (!matchName && !matchDesc && !matchSeller) {
            return false;
          }
        }
        return true;
      });

      // Render grid
      if (filtered.length === 0) {
        gridContainer.style.display = 'none';
        emptyContainer.style.display = 'flex';
        return;
      }

      gridContainer.style.display = 'grid';
      emptyContainer.style.display = 'none';

      let html = '';
      filtered.forEach(product => {
        html += `
          <article class="catalog-product-card">
            <div class="catalog-img-wrapper">
              <img src="${product.image}" alt="${product.name}" class="catalog-product-img" onerror="this.src='img/mochila_wayuu.png'" />
              <span class="catalog-product-category">${product.category}</span>
            </div>
            <div class="catalog-product-info">
              <span class="catalog-product-seller">Por: ${product.sellerName}</span>
              <h2>${product.name}</h2>
              <div class="catalog-product-rating" style="display: flex; align-items: center; gap: 0.35rem;">
                <!-- Star SVG Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="var(--primary)" color="var(--primary)" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                <span class="star-rating" style="font-weight: 600;">${product.rating.toFixed(1)}</span>
                <span class="reviews-count">(${product.reviewsCount} reseñas)</span>
              </div>
              <p class="catalog-product-desc">${product.description}</p>
              <div class="catalog-product-footer">
                <span class="catalog-product-price">${formatCOP(product.price)}</span>
                <a href="producto.html?id=${product.id}" class="btn btn-secondary">Ver detalles</a>
              </div>
            </div>
          </article>
        `;
      });

      gridContainer.innerHTML = html;
    }
  </script>
</body>
</html>
